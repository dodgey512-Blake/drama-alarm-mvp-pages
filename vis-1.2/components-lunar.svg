<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060"><style>text{font-family:'Avenir Next','PingFang SC',sans-serif;font-weight:550}@media(prefers-reduced-motion:reduce){animate{display:none}}</style><rect x="0" y="0" width="1200" height="1060" rx="0" fill="#f2f0f9" stroke="none"/><text x="40" y="65" font-size="22" fill="#776898">DRAMA ALARM / VIS 1.2 / LUNAR</text><text x="40" y="110" font-size="32" fill="#3d3a56">组件不是装饰：状态、任务与语言一起定义</text><text x="40" y="170" font-size="17" fill="#776898">01 / TYPOGRAPHY</text><text x="40" y="225" font-size="64" fill="#3d3a56">07:30</text><text x="270" y="210" font-size="24" fill="#3d3a56">清晨开场 / Morning Show</text><text x="270" y="247" font-size="16" fill="#69647d">正文 16–18 · 辅助至少14 · 行高自然增高</text><text x="40" y="310" font-size="17" fill="#776898">02 / ACTIONS</text><rect x="40" y="338" width="245" height="56" rx="19" fill="#776898" stroke="none"/><text x="68" y="373" font-size="18" fill="#fff">保存闹钟 · Save</text><rect x="310" y="338" width="245" height="56" rx="19" fill="#fcfbff" stroke="#d9d2e5"/><text x="335" y="373" font-size="18" fill="#3d3a56">取消 · Cancel</text><rect x="580" y="338" width="245" height="56" rx="19" fill="#d9d2e5" stroke="none"/><text x="604" y="373" font-size="18" fill="#69647d">不可用 · Disabled</text><rect x="850" y="338" width="300" height="56" rx="19" fill="#fcfbff" stroke="#776898"/><text x="875" y="373" font-size="18" fill="#3d3a56">键盘焦点 · Focus</text><text x="40" y="450" font-size="17" fill="#776898">03 / INPUT &amp; FEEDBACK</text><rect x="40" y="480" width="520" height="88" rx="20" fill="#fcfbff" stroke="#a22942"/><text x="60" y="513" font-size="15" fill="#69647d">时间 · Alarm time</text><text x="60" y="548" font-size="18" fill="#a22942">请选择有效时间 / Choose a valid time</text><rect x="600" y="480" width="550" height="88" rx="20" fill="#e7e1f3" stroke="none"/><text x="620" y="516" font-size="19" fill="#776898">已保存 / Saved</text><text x="620" y="548" font-size="16" fill="#69647d">确认真实结果后才显示成功</text><text x="40" y="630" font-size="17" fill="#776898">04 / CHOICE &amp; PROGRESS</text><rect x="40" y="660" width="520" height="92" rx="22" fill="#e7e1f3" stroke="#776898"/><text x="60" y="699" font-size="20" fill="#3d3a56">✓ 轻松 · 1题 / Gentle · 1 question</text><text x="60" y="730" font-size="15" fill="#69647d">实际组成优先 · 主题不加题</text><rect x="600" y="660" width="550" height="92" rx="22" fill="#fcfbff" stroke="#d9d2e5"/><text x="620" y="697" font-size="18" fill="#3d3a56">正在检查内容 / Checking content…</text><circle cx="630" cy="727" r="7" fill="#776898"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle><text x="650" y="733" font-size="15" fill="#69647d">旧内容仍可用 · 无购买权益变化</text><text x="40" y="815" font-size="17" fill="#776898">05 / COMPONENT RULES</text><text x="40" y="853" font-size="19" fill="#3d3a56">48 × 48 点击区域 · 54 高主按钮 · 4 / 8 间距 · 24–28 卡片圆角</text><text x="40" y="895" font-size="18" fill="#3d3a56">返回、取消、安全退出含义独立；默认、选中、错误、等待、空态均有文字。</text><text x="40" y="935" font-size="18" fill="#3d3a56">两主题功能相同；切语言保留名称、草稿、题目 ID 与正确选项 ID。</text><text x="40" y="990" font-size="16" fill="#69647d">Liquid Glass 运行效果请在可执行 Demo 查看；本板为原生SVG组件定义。</text></svg>