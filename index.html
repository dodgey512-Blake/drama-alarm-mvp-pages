  <title>Drama Alarm 5.0 · Your morning, your stage</title>
  <style data-source="styles.css">:root {
  --cream: #fbf2e9;
  --paper: #fffdf9;
  --plum: #452b3d;
  --plum-2: #3a2138;
  --plum-3: #2a1828;
  --muted: #a38e98;
  --rose: #e75a7c;
  --rose-soft: #fbe3e9;
  --lilac: #a588d4;
  --lilac-soft: #f0eafa;
  --gold: #f0ae4a;
  --error: #d6455e;
  --line: rgba(69, 43, 61, 0.12);
  --shadow: 0 18px 44px rgba(69, 43, 61, 0.11);
  --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
  --ease-ios: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --font-display: "Avenir Next", "Helvetica Neue", sans-serif;
}

* { box-sizing: border-box; }

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

html { min-height: 100%; background: #f2e8df; }

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  color: var(--plum);
  background:
    radial-gradient(circle at 10% 15%, rgba(231, 90, 124, 0.12), transparent 30%),
    radial-gradient(circle at 85% 75%, rgba(165, 136, 212, 0.14), transparent 34%),
    #f2e8df;
  font-family: "Avenir Next", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-wrap: pretty;
}

button, input { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible {
  outline: 3px solid rgba(231, 90, 124, 0.36);
  outline-offset: 3px;
}

.demo-shell { min-height: 100vh; padding: 18px clamp(14px, 3vw, 42px) 28px; }

.demo-topbar {
  width: min(1180px, 100%);
  min-height: 48px;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.wordmark {
  min-height: 44px;
  padding: 0;
  border: 0;
  background: transparent;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
}

.demo-topbar__actions { display: flex; align-items: center; gap: 10px; }
.demo-chip {
  min-height: 32px;
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 253, 249, 0.62);
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.icon-button, .scene-button {
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 253, 249, 0.72);
  cursor: pointer;
  transition: transform 200ms var(--ease), background 200ms var(--ease), border-color 200ms var(--ease);
}
.icon-button:hover, .scene-button:hover { transform: translateY(-1px); background: var(--paper); border-color: rgba(69, 43, 61, 0.22); }
.icon-button:active, .scene-button:active { transform: translateY(1px) scale(0.98); }
.scene-button { padding: 0 15px; display: inline-flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; }
.scene-button span { color: var(--rose); }

.demo-stage {
  width: min(1180px, 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(390px, 460px) minmax(320px, 1fr);
  align-items: start;
  justify-content: center;
  gap: clamp(24px, 5vw, 72px);
}

.phone-wrap { display: grid; justify-items: center; }
.phone {
  width: min(390px, calc(100vw - 28px));
  height: min(844px, calc(100vh - 112px));
  min-height: 620px;
  overflow: hidden;
  border: 1px solid rgba(69, 43, 61, 0.14);
  border-radius: clamp(34px, 8vw, 44px);
  background: var(--cream);
  box-shadow: 0 28px 80px rgba(69, 43, 61, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.45);
  position: relative;
  isolation: isolate;
}

#app, .screen { width: 100%; height: 100%; }
.screen {
  position: relative;
  overflow: hidden;
  background: var(--cream);
  animation: screen-in 420ms var(--ease) both;
}
.screen::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 20;
  pointer-events: none;
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px rgba(69, 43, 61, 0.05);
}
.screen--dark { color: #f6e7ec; background: var(--plum-2); }
.screen--system { color: #fffdf9; background: linear-gradient(145deg, #2a1828 0%, #70445f 54%, #a588d4 100%); }

@keyframes screen-in { from { opacity: 0; transform: translateY(6px) scale(0.996); } to { opacity: 1; transform: none; } }

.ambient {
  position: absolute;
  width: 320px;
  height: 260px;
  border-radius: 50%;
  filter: blur(46px);
  opacity: 0.22;
  pointer-events: none;
  animation: drift 11s ease-in-out infinite alternate;
}
.ambient--rose { left: -110px; top: 90px; background: var(--rose); }
.ambient--lilac { right: -120px; top: 30px; background: var(--lilac); animation-delay: -4s; }
.ambient--gold { left: 42px; top: 120px; background: var(--gold); animation: breathe 4s ease-in-out infinite; }
@keyframes drift { to { transform: translate(24px, 18px) scale(1.08); } }
@keyframes breathe { 50% { opacity: 0.34; transform: scale(1.08); } }

.status-bar {
  height: 70px;
  padding: 25px 42px 0;
  position: relative;
  z-index: 3;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 600;
}
.battery { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; opacity: 0.42; position: relative; }
.battery::before { content: ""; position: absolute; width: 14px; height: 7px; left: 2.5px; top: 1.2px; border-radius: 2px; background: currentColor; }
.battery::after { content: ""; position: absolute; width: 2px; height: 5px; right: -4px; top: 2px; border-radius: 1px; background: currentColor; opacity: 0.7; }

.screen-body { position: relative; z-index: 2; height: calc(100% - 70px); padding: 18px 42px 30px; display: flex; flex-direction: column; }
.screen-body--center { align-items: center; text-align: center; }
.screen-body--flush { padding-left: 0; padding-right: 0; }
.eyebrow { color: var(--rose); font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; }
.screen--dark .eyebrow { color: var(--gold); }
.screen-title { margin: 10px 0 0; font-size: clamp(28px, 7vw, 38px); line-height: 1.1; font-weight: 500; letter-spacing: -0.035em; }
.screen-copy { margin: 14px 0 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
.screen--dark .screen-copy { color: #c9a8b6; }

.spark { width: 16px; height: 16px; background: var(--gold); clip-path: polygon(50% 0, 60% 39%, 100% 50%, 60% 61%, 50% 100%, 40% 61%, 0 50%, 40% 39%); animation: sparkle 2.4s ease-in-out infinite; }
.spark--small { width: 13px; height: 13px; }
.spark--large { width: 96px; height: 96px; }
@keyframes sparkle { 50% { opacity: 0.55; transform: rotate(5deg) scale(0.92); } }

.primary, .secondary, .text-button {
  width: 100%;
  min-height: 58px;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 180ms var(--ease), box-shadow 180ms var(--ease), background 180ms var(--ease);
}
.primary { border: 0; background: var(--plum); color: var(--cream); font-size: 16px; font-weight: 600; box-shadow: 0 12px 28px rgba(69, 43, 61, 0.16); }
.primary:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(69, 43, 61, 0.22); }
.primary:active { transform: translateY(1px) scale(0.99); }
.screen--dark .primary { background: #f6e7ec; color: var(--plum-2); }
.secondary { border: 1px solid rgba(69, 43, 61, 0.2); background: transparent; color: var(--plum); font-size: 15px; }
.screen--dark .secondary { border-color: rgba(246, 231, 236, 0.3); color: #f6e7ec; }
.text-button { min-height: 44px; border: 0; background: transparent; color: var(--muted); font-size: 12px; }
.button-stack { width: 100%; margin-top: auto; display: grid; gap: 12px; }

.brand-stage { width: 100%; height: 330px; margin-top: 18px; position: relative; display: grid; place-items: center; }
.curtain-mini { position: absolute; inset: 0; overflow: hidden; }
.curtain-mini::before, .curtain-mini::after { content: ""; position: absolute; top: 15px; bottom: 0; width: 92px; background: linear-gradient(90deg, #e75a7c, #f28aa2); }
.curtain-mini::before { left: 0; clip-path: polygon(0 0, 100% 10%, 76% 100%, 0 84%); }
.curtain-mini::after { right: 0; clip-path: polygon(0 10%, 100% 0, 100% 84%, 24% 100%); }
.curtain-valance { position: absolute; left: 0; right: 0; top: 15px; height: 58px; background: var(--rose); clip-path: polygon(0 0,100% 0,100% 55%,94% 80%,88% 55%,82% 80%,76% 55%,70% 80%,64% 55%,58% 80%,52% 55%,46% 80%,40% 55%,34% 80%,28% 55%,22% 80%,16% 55%,10% 80%,4% 55%,0 80%); }
.spotlight { position: absolute; top: 48px; width: 170px; height: 260px; background: linear-gradient(to bottom, rgba(240,174,74,.28), rgba(240,174,74,0)); clip-path: polygon(45% 0,55% 0,100% 100%,0 100%); animation: breathe 4s ease-in-out infinite; }

.permission-mark, .gentle-mark, .wake-mark {
  width: 136px;
  height: 136px;
  border-radius: 50%;
  background: var(--paper);
  box-shadow: var(--shadow);
  display: grid;
  place-items: center;
  position: relative;
}
.permission-mark::before { content: ""; width: 62px; height: 34px; border: 4px solid var(--rose); border-color: var(--rose) transparent transparent; border-radius: 50%; transform: translateY(16px); }
.permission-mark::after { content: ""; position: absolute; width: 14px; height: 14px; top: 41px; border-radius: 50%; background: var(--gold); animation: breathe 2.4s ease-in-out infinite; }
.permission-list { width: 100%; margin: 28px 0 0; padding: 20px 24px; border-radius: 26px; background: var(--paper); box-shadow: var(--shadow); display: grid; gap: 18px; text-align: left; }
.permission-list p { margin: 0; display: flex; align-items: center; gap: 14px; font-size: 14px; }
.permission-list i { width: 8px; height: 8px; border-radius: 50%; background: var(--rose); }
.permission-list p:nth-child(2) i { background: var(--lilac); }
.permission-list p:nth-child(3) i { background: var(--gold); }

.page-dots { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
.page-dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(69,43,61,.18); }
.page-dots i.active { background: var(--rose); }

.math-progress { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 12px; }
.math-progress i:first-child { width: 10px; height: 10px; border-radius: 50%; background: var(--rose); }
.math-progress i:last-child { width: 14px; height: 14px; border: 2px solid var(--lilac); transform: rotate(45deg); }
.math-equation { margin: auto 0 18px; font-size: clamp(62px, 18vw, 78px); line-height: 1; font-weight: 500; letter-spacing: -0.05em; }
.math-input { width: 126px; min-height: 62px; border: 0; border-bottom: 1px solid rgba(69,43,61,.22); background: transparent; color: var(--plum); text-align: center; font-size: 42px; caret-color: var(--rose); }
.math-hint { min-height: 24px; margin: 12px 0 16px; color: var(--muted); font-size: 13px; }
.math-hint--wrong { color: var(--error); font-size: 15px; }
.wrong-value { color: var(--error); animation: shake 600ms var(--ease); }
@keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }

.keypad { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 28px; }
.key {
  min-width: 54px;
  min-height: 54px;
  border: 0;
  border-radius: 50%;
  background: var(--paper);
  color: var(--plum);
  box-shadow: 0 6px 16px rgba(69,43,61,.08);
  font-size: 23px;
  cursor: pointer;
  transition: transform 140ms ease, box-shadow 140ms ease;
}
.key:hover { transform: translateY(-1px); box-shadow: 0 9px 18px rgba(69,43,61,.12); }
.key:active { transform: translateY(2px) scale(.96); }
.key--submit { background: var(--rose); color: var(--paper); }
.key--plain { background: transparent; box-shadow: none; color: var(--muted); font-size: 17px; }
.key:disabled { opacity: .38; cursor: not-allowed; }

.screen-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.screen-head h1 { margin: 0; font-size: 14px; font-weight: 600; }
.ringing-state { color: var(--rose); font-size: 12px; display: flex; align-items: center; gap: 8px; }
.ringing-state i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse-dot 1s ease-in-out infinite; }
@keyframes pulse-dot { 50% { opacity: .35; transform: scale(.72); } }

.riddle-question { margin: 58px -8px 24px; text-align: center; font-size: 21px; line-height: 1.35; font-weight: 500; }
.riddle-options { display: grid; gap: 10px; }
.riddle-option { min-height: 64px; padding: 0 18px; border: 1px solid transparent; border-radius: 24px; background: var(--paper); box-shadow: 0 7px 20px rgba(69,43,61,.07); display: flex; align-items: center; gap: 16px; color: var(--plum); cursor: pointer; text-align: left; }
.riddle-option span { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; background: var(--lilac-soft); color: var(--lilac); display: grid; place-items: center; font-size: 13px; }
.riddle-option:hover { border-color: rgba(165,136,212,.5); transform: translateY(-1px); }
.riddle-option.is-wrong { border-color: rgba(214,69,94,.45); background: var(--rose-soft); color: var(--error); animation: shake 600ms var(--ease); }
.riddle-option.is-wrong span { background: var(--error); color: white; }

.alarm-card { padding: 22px 24px; border-radius: 27px; background: var(--paper); box-shadow: var(--shadow); }
.alarm-card + .alarm-card { margin-top: 14px; }
.alarm-card__top { display: flex; align-items: center; justify-content: space-between; }
.alarm-card__edit, .alarm-card__details { padding: 0; border: 0; background: transparent; color: inherit; cursor: pointer; text-align: left; }
.alarm-card__edit { border-radius: 12px; }
.alarm-card__details { width: 100%; display: block; }
.alarm-card__details .alarm-meta, .alarm-card__details .tags { display: flex; }
.alarm-card__edit:focus-visible, .alarm-card__details:focus-visible { outline: 3px solid rgba(231,90,124,.34); outline-offset: 4px; }
.alarm-time { font-size: 34px; font-weight: 500; letter-spacing: -0.04em; }
.alarm-time small { color: var(--muted); font-size: 15px; font-weight: 500; }
.alarm-meta { margin-top: 5px; color: var(--muted); font-size: 13px; }
.tags { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.tag { padding: 6px 10px; border-radius: 999px; background: var(--rose-soft); color: var(--rose); font-size: 11px; }
.tag--lilac { background: var(--lilac-soft); color: var(--lilac); }
.toggle { width: 48px; height: 28px; padding: 3px; border: 0; border-radius: 999px; background: rgba(69,43,61,.13); cursor: pointer; transition: background 200ms var(--ease); }
.toggle::after { content: ""; display: block; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); box-shadow: 0 2px 6px rgba(69,43,61,.12); transition: transform 200ms var(--ease); }
.toggle.is-on { background: var(--rose); }
.toggle.is-on::after { transform: translateX(20px); }

.home-countdown { margin: 30px 0 26px; }
.home-countdown strong { display: block; margin-top: 5px; font-size: clamp(45px, 13vw, 62px); font-weight: 500; letter-spacing: -0.05em; }
.home-countdown p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.floating-add { width: 64px; height: 64px; margin: auto auto 8px; border: 0; border-radius: 50%; background: var(--plum); color: var(--cream); font-size: 34px; font-weight: 300; cursor: pointer; box-shadow: 0 14px 30px rgba(69,43,61,.2); transition: transform 200ms var(--ease); }
.floating-add:hover { transform: translateY(-3px) rotate(4deg); }
.bottom-nav { height: 52px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
.bottom-nav button { min-height: 44px; border: 0; border-radius: 14px; background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; }
.bottom-nav button.active { color: var(--rose); background: rgba(231,90,124,.08); }

.editor-time { width: 100%; margin: 12px 0 18px; border: 0; background: transparent; color: var(--plum); text-align: center; font-size: 66px; font-weight: 500; letter-spacing: -0.04em; }
.time-field { display: block; position: relative; }
.editor-time { appearance: none; -webkit-appearance: none; }
.editor-time::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; opacity: 0; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; margin-bottom: 18px; }
.day { aspect-ratio: 1; min-height: 38px; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; }
.day.is-on { border-color: transparent; background: var(--rose-soft); color: var(--rose); }
.form-card { padding: 8px 20px; border-radius: 25px; background: var(--paper); box-shadow: var(--shadow); }
.form-row { min-height: 54px; border-bottom: 1px solid rgba(69,43,61,.07); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.form-row:last-child { border-bottom: 0; }
.form-row label { font-size: 14px; }
.form-row small { color: var(--muted); }
.segment { display: flex; gap: 5px; }
.segment button { min-height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; }
.segment button.is-on { border-color: var(--plum); background: var(--plum); color: var(--cream); }

.ready-time { margin: 36px 0 0; font-size: 76px; font-weight: 500; letter-spacing: -0.05em; }
.ready-meta { color: var(--muted); font-size: 14px; }
.countdown-label { min-height: 22px; margin-top: 7px; color: var(--rose); font-size: 12px; }
.check-card { width: 100%; margin-top: 28px; padding: 22px 24px; border-radius: 27px; background: var(--paper); box-shadow: var(--shadow); text-align: left; }
.check-card p { margin: 13px 0 0; display: flex; align-items: center; gap: 12px; font-size: 14px; }
.check-card i { width: 18px; height: 18px; border-radius: 50%; background: var(--rose); position: relative; }
.check-card i::after { content: ""; position: absolute; left: 5px; top: 4px; width: 6px; height: 3px; border-left: 2px solid white; border-bottom: 2px solid white; transform: rotate(-45deg); }

.showtime-rings { width: 318px; height: 318px; margin: 38px auto 0; position: relative; display: grid; place-items: center; }
.showtime-rings::before, .showtime-rings::after { content: ""; position: absolute; border: 1px solid rgba(246,231,236,.13); border-radius: 50%; animation: ring-out 2.5s ease-out infinite; }
.showtime-rings::before { inset: 20px; }
.showtime-rings::after { inset: 50px; animation-delay: -1.25s; }
@keyframes ring-out { 0% { transform: scale(.74); opacity: .8; } 100% { transform: scale(1.2); opacity: 0; } }
.showtime-time { font-size: 84px; font-weight: 500; letter-spacing: -0.07em; }
.showtime-label { position: absolute; bottom: 56px; color: var(--gold); font-size: 12px; letter-spacing: .35em; }

.curtain-screen { background: var(--plum-3); }
.curtain-left, .curtain-right { position: absolute; top: 0; bottom: 0; width: 52%; z-index: 3; background: linear-gradient(90deg, #c91f4c, #e14d72 70%, #b51c44); animation-duration: 1.65s; animation-timing-function: var(--ease); animation-fill-mode: forwards; }
.curtain-left { left: 0; clip-path: polygon(0 0,100% 0,82% 100%,0 100%); animation-name: curtain-left; }
.curtain-right { right: 0; clip-path: polygon(0 0,100% 0,100% 100%,18% 100%); animation-name: curtain-right; }
@keyframes curtain-left { to { transform: translateX(-78%); } }
@keyframes curtain-right { to { transform: translateX(78%); } }
.curtain-content { position: relative; z-index: 2; height: 100%; display: grid; place-items: center; text-align: center; color: #f6e7ec; }
.curtain-content strong { display: block; margin-top: 18px; font-size: 84px; font-weight: 500; }

.wrong-panel { margin-top: 46px; text-align: center; }
.loading-dots { margin: 28px 0; display: flex; justify-content: center; gap: 8px; }
.loading-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--lilac); animation: dot-wave 1.2s ease-in-out infinite; }
.loading-dots i:nth-child(2) { animation-delay: .2s; }
.loading-dots i:nth-child(3) { animation-delay: .4s; }
@keyframes dot-wave { 50% { opacity: .3; transform: translateY(-5px); } }

.scene-panel {

input[type="range"]::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -8.5px; appearance: none; border: 4px solid var(--paper); border-radius: 50%; background: var(--plum); box-shadow: 0 3px 10px rgba(69,43,61,.22); }

input[type="range"]::-moz-range-thumb { width: 15px; height: 15px; border: 4px solid var(--paper); border-radius: 50%; background: var(--plum); box-shadow: 0 3px 10px rgba(69,43,61,.22); }

.empty-alarm__bell { width: 72px; height: 72px; margin-bottom: 18px; border-radius: 50%; background: var(--rose-soft); position: relative; }

.empty-alarm .secondary { min-height: 50px; }
.floating-add { position: relative; flex: 0 0 64px; }
.floating-add span::before, .floating-add span::after { content: ""; position: absolute; left: 21px; right: 21px; top: 31px; height: 2px; border-radius: 2px; background: var(--cream); }
.floating-add span::after { transform: rotate(90deg); }
.bottom-nav { flex: 0 0 58px; }
.bottom-nav button { display: grid; place-items: center; align-content: center; gap: 4px; }
.bottom-nav button span { display: block; }
.nav-mark { width: 16px; height: 13px; display: block; position: relative; opacity: .7; }
.nav-mark--home { border: 1.5px solid currentColor; border-top: 0; border-radius: 2px; }
.nav-mark--home::before { content: ""; position: absolute; width: 10px; height: 10px; left: 1.5px; top: -5px; border-left: 1.5px solid currentColor; border-top: 1.5px solid currentColor; transform: rotate(45deg); }
.nav-mark--run { border: 1.5px solid currentColor; border-radius: 50%; }

.editor-body { padding-top: 0; padding-bottom: 34px; }
.sticky-head { min-height: 50px; flex: 0 0 auto; }
.alarm-label-field { display: grid; gap: 7px; margin-top: 6px; }
.alarm-label-field input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,253,249,.72); color: var(--plum); outline: none; }
.alarm-label-field input:focus { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(231,90,124,.1); }
.editor-time { margin: 10px 0 12px; font-size: 58px; }
.form-row--button { width: 100%; padding: 0; border: 0; background: transparent; color: inherit; cursor: pointer; text-align: left; }
.form-row--button > span { display: grid; gap: 3px; }
.form-row--button strong { color: var(--rose); font-size: 11px; }
.volume-row { min-height: 80px; display: grid; grid-template-columns: 1fr auto; align-content: center; }
.volume-row span, .volume-row b, .volume-row small { display: block; }
.volume-row b { font-size: 14px; font-weight: 500; }
.volume-row input { grid-column: 1 / -1; }
.volume-row output { color: var(--rose); font-size: 11px; font-weight: 700; }
.form-error { margin: 12px 4px 0; color: var(--error); font-size: 12px; }
.editor-actions { margin-top: 18px; display: grid; gap: 6px; }
.text-button--danger { color: var(--error); }

.ready-spark { width: 48px; height: 48px; margin-top: 8px; }
.ready-eyebrow { margin-top: 18px; }
.ready-time { display: flex; align-items: flex-end; gap: 8px; }
.ready-time small { margin-bottom: 12px; color: var(--muted); font-size: 16px; letter-spacing: 0; }
.ready-check { margin-top: 22px; }
.ready-check p { display: grid; grid-template-columns: 18px 1fr auto; }
.ready-check strong { color: var(--muted); font-size: 10px; }

.ringing-state--hero { color: var(--rose); }
.ringing-state--lilac { color: var(--lilac); }
.showtime-rings small { position: absolute; bottom: 32px; color: #c9a8b6; font-size: 10px; letter-spacing: .08em; }
.curtain-caption { position: absolute; bottom: 48px; color: #c9a8b6; }
.emergency-link { position: absolute; right: 32px; top: 78px; width: auto; }
.wrong-copy { margin: 0 0 24px; }
.riddle-copy { margin: 0 0 16px; text-align: center; }
.riddle-question--wrong { margin-top: 18px; }
.shift-label { background: none; padding: 0; }
.gentle-mark--v2 { margin-top: 34px; }
.safety-title { margin-top: 28px; max-width: 290px; }
.emergency-availability { margin-top: 0; }
.emergency-quote { color: #e9c6d2; text-align: center; line-height: 1.7; }
.emergency-rule { margin: 0; color: #8c6e7c; font-size: 10px; text-align: center; }
.wake-mark--v2 { margin-top: 40px; }
.wake-title { margin-top: 34px; }
.wake-timeout { margin-top: 28px; }
.permission-off-title { margin-top: 28px; }

.settings-head h1 { font-size: 28px; }
.inline-setting { display: flex; align-items: center; gap: 8px; }
.gold-link { color: #b87818 !important; }
.danger-link { color: var(--error) !important; }

.sound-booth { padding-top: 0; padding-bottom: 28px; }
.sound-head { min-height: 52px; }
.sound-list { display: grid; gap: 10px; margin: 20px 0 16px; }
.sound-card { min-height: 94px; margin: 0; padding: 13px; grid-template-columns: 1fr auto; position: relative; }
.sound-card__main { min-width: 0; padding: 0; border: 0; background: transparent; display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 12px; color: inherit; cursor: pointer; text-align: left; }
.sound-card__main b, .sound-card__main small { display: block; }
.sound-card__main b { font-size: 14px; }
.sound-card__main small { margin-top: 4px; color: var(--muted); font-size: 9.5px; line-height: 1.4; }
.sound-card .sound-icon { width: 52px; height: 52px; color: var(--rose); }
.sound-card--lilac .sound-icon { background: var(--lilac-soft); color: var(--lilac); }
.sound-card--gold .sound-icon { background: rgba(240,174,74,.16); color: #b87818; }
.selected-badge { position: absolute; top: 8px; right: 12px; color: var(--rose); font-size: 7px; font-weight: 700; letter-spacing: .12em; }
.selected-sound-bar { position: sticky; bottom: -28px; margin: 8px -6px -28px; padding: 14px 6px 18px; background: linear-gradient(transparent,var(--cream) 18%); display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 12px; }
.selected-sound-bar span, .selected-sound-bar strong { display: block; }
.selected-sound-bar span { color: var(--muted); font-size: 8px; text-transform: uppercase; letter-spacing: .1em; }
.selected-sound-bar strong { margin-top: 3px; font-size: 11px; }
.selected-sound-bar .primary { min-height: 50px; font-size: 13px; }

.pass-close { position: absolute; right: 28px; top: 5px; width: 44px; font-size: 24px; }
.pass-spark { width: 72px; height: 72px; margin-top: 24px; }
.primary--danger { background: var(--error); color: white; }
.modal-actions { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions .primary, .modal-actions .secondary { min-height: 52px; font-size: 13px; }

.empty-run { margin: auto 0; display: grid; justify-items: center; }
.empty-run h1 { margin: 28px 0 0; max-width: 280px; font-size: 31px; line-height: 1.08; font-weight: 500; letter-spacing: -.04em; }
.empty-run p { max-width: 280px; color: var(--muted); font-size: 12px; line-height: 1.6; }
.muted-eyebrow { color: var(--muted); }
.run-stats { margin-top: 26px; border-radius: 24px; background: var(--paper); box-shadow: var(--shadow); }
.curtain-calls-label { align-self: flex-start; margin-top: 28px; }
.achievements { grid-template-columns: repeat(3,1fr); }
.achievement { opacity: .48; }
.achievement:first-child, .achievement.is-earned { opacity: 1; }
.run-nav { width: 100%; margin-top: auto; }
.rare-title { font-size: 38px; }
.rare-copy { color: #e9c6d2; line-height: 1.7; text-align: center; }

.system-card .system-app strong { display: block; font-size: 18px; }
.system-card > p { margin: 20px 0 0; line-height: 1.5; }
.system-note { margin: 18px 0 0 !important; text-align: center; opacity: .68; font-size: 10px; }
.system-caption { position: absolute; left: 0; right: 0; bottom: 48px; text-align: center; opacity: .62; font-size: 10px; }
.system-caption span { display: inline-block; margin-top: 8px; }

@media (max-width: 820px) {
  .demo-shell { min-height: 100dvh; padding: 0; display: block; }
  .demo-stage { display: block; }
  .phone { width: 100vw; height: 100dvh; min-height: 580px; border: 0; border-radius: 0; box-shadow: none; }
  .qa-mode .demo-shell { padding: 8px 0 0; }
  .qa-mode .phone { width: min(390px,100vw); height: calc(100dvh - 64px); border-radius: 34px 34px 0 0; }
  .qa-mode .scene-panel { display: flex !important; }
  .qa-mode .prototype-note { display: none !important; }
}

@media (max-height: 700px) {
  .welcome-body .brand-stage { height: 220px; }
  .arrival-card { display: none; }
  .sound-hero { min-height: 184px; padding-top: 14px; }
  .sound-hero__disc { width: 72px; height: 72px; }
  .permission-list { gap: 10px; margin-top: 18px; padding-block: 14px; }
  .pass-list { margin-block: 18px; gap: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  .launch-curtain { transition-delay: 0ms !important; }
  .sound-wave.is-playing i { animation: none !important; }
  .screen { animation: none !important; opacity: 1 !important; transform: none !important; }
}

.primary:disabled,
.secondary:disabled,
.text-button:disabled {
  cursor: not-allowed;
  opacity: .48;
  transform: none;
}

input[type="range"]:focus-visible {
  outline: 3px solid rgba(95, 45, 74, .22);
  outline-offset: 5px;
}

/* v3.0 readability, alignment, motion and sound-library system */
:root {
  --muted: #765f6b;
  --type-micro: 12px;
  --type-caption: 13px;
  --type-small: 14px;
  --type-body: 16px;
  --shadow-soft: 0 8px 24px rgba(69, 43, 61, .075);
  --shadow-raised: 0 18px 46px rgba(69, 43, 61, .13);
  --motion-fast: 160ms;
  --motion-base: 280ms;
  --motion-page: 360ms;
}

button, input { -webkit-tap-highlight-color: transparent; }

.screen { animation-duration: var(--motion-page); }
.screen-body {
  padding: 16px 30px 26px;
  animation: content-settle var(--motion-page) var(--ease) both;
}
.screen-body--flush { padding-left: 0; padding-right: 0; }
.status-bar { padding-inline: 30px; font-size: 15px; }

@keyframes content-settle {
  from { opacity: .01; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes tab-pop {
  0% { transform: translateY(2px) scale(.84); opacity: .5; }
  70% { transform: translateY(-1px) scale(1.07); opacity: 1; }
  100% { transform: none; opacity: 1; }
}
@keyframes card-arrive {
  from { opacity: .01; transform: translateY(7px) scale(.985); }
  to { opacity: 1; transform: none; }
}

.eyebrow {
  font-size: var(--type-micro);
  line-height: 1.35;
  font-weight: 700;
  letter-spacing: .18em;
}
.screen-title { font-size: clamp(31px, 8.2vw, 40px); line-height: 1.08; font-weight: 600; }
.screen-copy { font-size: var(--type-body); line-height: 1.55; }
.screen--dark .screen-copy { color: #ddc3ce; }
.privacy-line, .prototype-note { font-size: var(--type-micro); line-height: 1.5; }

.screen-head {
  min-height: 52px;
  align-items: center;
}
.screen-head h1 { font-size: 17px; line-height: 1.2; font-weight: 600; }
.screen-head > span:empty { width: 44px; flex: 0 0 44px; }
.compact-button {
  width: 44px;
  height: 44px;
  min-height: 44px;
  display: grid;
  place-items: center;
  line-height: 1;
}
.back-chevron { font-size: 30px; font-weight: 400; transform: translateY(-1px); }
.text-button { font-size: var(--type-small); font-weight: 500; }
.primary { font-size: 17px; }
.secondary { font-size: 16px; font-weight: 500; }
.primary, .secondary, .text-button { transition-duration: var(--motion-fast); }

.permission-list p, .check-card p, .pass-list p { font-size: 15px; line-height: 1.4; }
.permission-list small, .permission-list strong { font-size: var(--type-caption); line-height: 1.45; }
.arrival-card strong { font-size: var(--type-small); }
.arrival-card span { font-size: var(--type-caption); line-height: 1.45; }
.arrival-card { min-height: 76px; padding: 15px 17px; }

.ringing-state { font-size: var(--type-caption); font-weight: 600; }
.showtime-rings small { font-size: var(--type-caption); }
.math-equation { font-size: clamp(62px, 18vw, 78px); }
.math-equation--long { font-size: clamp(37px, 10vw, 48px); letter-spacing: -.045em; white-space: nowrap; }
.math-hint { font-size: var(--type-small); line-height: 1.45; }
.math-hint--wrong { font-size: 16px; }
.key { min-width: 58px; min-height: 58px; font-size: 25px; box-shadow: var(--shadow-soft); }
.key--plain { font-size: 20px; }
.keypad { gap: 11px 24px; }

.riddle-question { font-size: 23px; line-height: 1.38; font-weight: 600; }
.riddle-option { min-height: 66px; font-size: 16px; line-height: 1.35; transition: transform var(--motion-fast) var(--ease), border-color var(--motion-fast), background var(--motion-fast); }
.riddle-option span { width: 32px; height: 32px; flex-basis: 32px; font-size: var(--type-caption); font-weight: 700; }

.alarm-card, .form-card, .settings-card, .sound-card, .check-card, .arrival-card, .rehearsal-summary, .run-stats {
  box-shadow: var(--shadow-soft);
}
.alarm-card, .sound-card, .settings-card, .premium-sound-card, .sound-upgrade-strip {
  animation: card-arrive var(--motion-base) var(--ease) both;
}
.alarm-card { padding: 22px; }
.alarm-time { font-size: 37px; }
.alarm-time small { font-size: 17px; }
.alarm-label { font-size: var(--type-small); }
.alarm-meta, .home-countdown p { font-size: var(--type-small); line-height: 1.45; }
.tag { font-size: var(--type-micro); font-weight: 600; }
.home-countdown { margin-top: 24px; }

.bottom-nav { height: 66px; flex-basis: 66px; gap: 8px; margin-top: 8px; }
.bottom-nav button {
  min-height: 52px;
  border-radius: 17px;
  font-size: var(--type-caption);
  line-height: 1.1;
  font-weight: 600;
  transition: color var(--motion-fast), background var(--motion-fast), transform var(--motion-fast) var(--ease);
}
.bottom-nav button:active { transform: scale(.97); }
.bottom-nav button.active { background: rgba(231,90,124,.11); }
.bottom-nav button.active .nav-mark { animation: tab-pop 300ms var(--ease) both; }
.nav-mark { width: 19px; height: 16px; opacity: .82; }
.nav-mark--home::before { width: 12px; height: 12px; left: 1.8px; top: -6px; }

.alarm-label-field { font-size: var(--type-small); }
.alarm-label-field input { height: 50px; font-size: 16px; }
.days { gap: 8px; }
.day { min-height: 42px; font-size: var(--type-small); font-weight: 600; transition: transform var(--motion-fast) var(--ease), background var(--motion-fast); }
.day:active { transform: scale(.92); }
.form-row { min-height: 58px; }
.form-row label, .settings-row label { font-size: 15px; font-weight: 500; }
.form-row small, .settings-row small { font-size: var(--type-caption); line-height: 1.35; }
.form-row--button strong, .volume-row output { font-size: var(--type-caption); }
.segment button { min-height: 40px; padding-inline: 11px; font-size: var(--type-micro); font-weight: 600; }
.form-error { font-size: var(--type-small); }

.sound-upgrade-strip {
  width: 100%;
  min-height: 66px;
  margin-top: 12px;
  padding: 0 18px;
  border: 1px solid rgba(240,174,74,.3);
  border-radius: 22px;
  background: linear-gradient(120deg, rgba(240,174,74,.15), rgba(255,253,249,.82));
  color: var(--plum);
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-align: left;
  cursor: pointer;
}
.sound-upgrade-strip span, .sound-upgrade-strip b, .sound-upgrade-strip small { display: block; }
.sound-upgrade-strip b { font-size: 15px; }
.sound-upgrade-strip small { margin-top: 3px; color: var(--muted); font-size: var(--type-caption); }
.sound-upgrade-strip > strong { color: #986216; font-size: var(--type-caption); }

.settings-group > span { font-size: var(--type-micro); font-weight: 700; letter-spacing: .16em; }
.settings-row { min-height: 58px; }
.settings-row button:not(.toggle) { font-size: var(--type-small); font-weight: 500; }
.settings-head h1 { font-size: 29px; }

.sound-booth { padding-bottom: 30px; }
.sound-head { min-height: 52px; }
.sound-list { gap: 12px; margin: 12px 0 20px; }
.sound-section-head {
  margin-top: 24px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.sound-section-head span { color: var(--rose); font-size: var(--type-micro); font-weight: 700; letter-spacing: .15em; }
.sound-section-head small { color: var(--muted); font-size: var(--type-micro); }
.sound-library-teaser {
  width: 100%;
  min-height: 68px;
  margin-top: 18px;
  padding: 0 17px;
  border: 1px solid rgba(240,174,74,.32);
  border-radius: 22px;
  background: linear-gradient(120deg, rgba(240,174,74,.16), rgba(165,136,212,.1));
  color: var(--plum);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
  cursor: pointer;
  animation: card-arrive var(--motion-base) var(--ease) both;
}
.sound-library-teaser span, .sound-library-teaser small, .sound-library-teaser b { display: block; }
.sound-library-teaser small { color: #986216; font-size: 11px; font-weight: 800; letter-spacing: .1em; }
.sound-library-teaser b { margin-top: 4px; font-size: 15px; }
.sound-library-teaser > strong { color: #7658a6; font-size: var(--type-caption); }
.sound-card { min-height: 102px; padding: 14px; }
.sound-card__main b { font-size: 16px; }
.sound-card__main small { font-size: var(--type-caption); line-height: 1.4; }
.sound-action { min-width: 64px; min-height: 44px; font-size: var(--type-caption); font-weight: 600; }
.selected-badge { top: 9px; right: 15px; font-size: 11px; }
.selected-sound-bar { grid-template-columns: 106px 1fr; }
.selected-sound-bar span { font-size: 11px; }
.selected-sound-bar strong { font-size: var(--type-caption); }
.selected-sound-bar .primary { font-size: 15px; }

.backstage-library {
  margin: 8px -4px 24px;
  padding: 4px 4px 18px;
  border-radius: 28px;
}
.backstage-library > p { margin: 9px 0 14px; color: var(--muted); font-size: var(--type-small); line-height: 1.5; }
.premium-sound-list { display: grid; gap: 10px; margin-bottom: 12px; }
.premium-sound-card {
  min-height: 106px;
  padding: 12px;
  border: 1px solid rgba(240,174,74,.24);
  border-radius: 24px;
  background: linear-gradient(125deg, rgba(255,253,249,.96), rgba(240,174,74,.12));
  box-shadow: var(--shadow-soft);
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
}
.premium-sound-card--lilac { border-color: rgba(165,136,212,.25); background: linear-gradient(125deg, rgba(255,253,249,.96), rgba(165,136,212,.13)); }
.premium-sound-card__preview {
  min-width: 0;
  min-height: 72px;
  padding: 0;
  border: 0;
  background: transparent;
  display: grid;
  grid-template-columns: 54px 1fr;
  align-items: center;
  gap: 12px;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

    star: '<path d="m12 2 2.8 6.2 6.7.8-5 4.6 1.4 6.6L12 16.8l-5.9 3.4 1.4-6.6L2.5 9l6.7-.8Z"/>',
    math: '<path d="M5 7h6M8 4v6m6 7h6M4 17h6m11-7-5 5m0-5 5 5"/>',
    riddle: '<path d="M5 4h14v13H9l-4 4Z"/><path d="M9 8a3 3 0 0 1 6 0c0 2-3 2-3 4m0 2v.1"/>',
    sound: '<path d="m4 9 4-4v14l-4-4H2V9Zm8-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>',
    volume: '<path d="m4 9 5-4v14l-5-4H2V9Zm10-1v8m4-11v14m4-9v4"/>',
    access: '<rect x="5" y="3" width="14" height="18" rx="4"/><path d="m9 12 2 2 4-4M10 18h4"/>',
    clock: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M4 3 1 6m19-3 3 3"/>',
    haptics: '<rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4 8v8m16-8v8M1 10v4m22-4v4"/>',
    reset: '<path d="M5 7h14M9 7V4h6v3m-8 0 1 14h8l1-14M10 11v6m4-6v6"/>',
    pass: '<path d="M3 6h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4Zm12 0v3m0 3v1m0 3v2"/>',
    close: '<path d="m6 6 12 12M18 6 6 18"/>',
    backspace: '<path d="m8 5-6 7 6 7h13V5Zm4 4 6 6m0-6-6 6"/>',
    moon: '<path d="M20 15.5A9 9 0 0 1 8.5 4 9 9 0 1 0 20 15.5Z"/>',
    leaf: '<path d="M20 4C9 2 3 8 6 16s17 1 14-12ZM5 20 16 9"/>',
  };

  function icon(name, className = "") {
    return `<svg class="v5-icon ${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name] || iconPaths.star}</svg>`;
  }

  function settingIcon(name) {
    return `<i class="setting-icon setting-icon--${name}">${icon(name)}</i>`;
  }

  function morningArt(className = "") {
    return `<svg class="morning-art ${className}" viewBox="0 0 160 130" fill="none" aria-hidden="true"><circle class="morning-art__halo" cx="83" cy="55" r="42" fill="currentColor" opacity=".12"/><circle class="morning-art__sun" cx="83" cy="55" r="25" fill="currentColor"/><path d="M20 94c13-12 24-18 34-18s19 9 30 9 27-13 56-3v29H20Z" fill="currentColor" opacity=".18"/><path d="M25 107h110M83 15V8m36 25 7-5M47 31l-6-6m87 33h9M30 59h8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path class="morning-art__curtain" d="M15 14h28c0 33-4 57-28 76Zm130 0h-28c0 33 4 57 28 76Z" fill="currentColor" opacity=".22"/><path d="M72 58c2 3 5 5 11 5s9-2 11-5" stroke="var(--bg, #fff)" stroke-width="2.5" stroke-linecap="round"/></svg>`;
  }

  function themeInfo(state, id) {
    return (state.themes || []).find((theme) => theme.id === id) || {
      id, name: id === "daybreak" ? "Daybreak" : "Velvet", subtitle: id === "daybreak" ? "Fresh air. A clear beginning." : "A little theatre. A softer dawn.",
      description: id === "daybreak" ? "Mint light, airy cards and quiet focus." : "Cream, rose and lilac. Your original morning stage.",
    };
  }

  function themeArtwork(id, compact = false) {
    return `<div class="theme-choice-art theme-choice-art--${id}${compact ? " theme-choice-art--compact" : ""}">${morningArt()}<span class="theme-art-orbit"></span><span class="theme-art-dot"></span><div class="theme-art-card"><i></i><span></span><b></b></div></div>`;
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[character]));
  }

  function currentTime(state) {
    return new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit" }).format(state.now || new Date()).replace(" AM", "").replace(" PM", "");
  }

  function alarmTime(time) {
    const [hour, minute] = String(time || "06:30").split(":").map(Number);
    const date = new Date(2026, 0, 1, hour, minute);
    const parts = new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit", hour12: true }).formatToParts(date);
    return {
      time: `${parts.find((part) => part.type === "hour")?.value}:${parts.find((part) => part.type === "minute")?.value}`,
      period: parts.find((part) => part.type === "dayPeriod")?.value || "",
    };
  }

  function dayLabel(days) {
    const value = (days || []).join(",");
    if (value === "0,1,2,3,4,5,6") return "Every day";
    if (value === "1,2,3,4,5") return "Weekdays";
    if (value === "0,6") return "Weekends";
    return (days || []).map((day) => ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][day]).join(" · ") || "No days";
  }

  function soundById(id) {
    return soundPresets.find((preset) => preset.id === id) || soundPresets[0];
  }

  function mathExpression(math) {
    return math.expression || `${math.a} ${math.op} ${math.b}`;
  }

  function status(state, dark, override) {
    return `<div class="status-bar${dark ? " status-bar--dark" : ""}"><span>${override || currentTime(state)}</span><i class="battery" aria-label="Battery"></i></div>`;
  }

  function ambient(kind) {
    return `<i class="ambient ambient--${kind}" aria-hidden="true"></i>`;
  }

  function progress(active) {
    return `<div class="act-progress" aria-label="Setup progress"><i class="${active >= 1 ? "is-done" : "is-active"}"></i><span></span><i class="${active >= 2 ? "is-done" : active === 1 ? "is-active" : ""}"></i><span></span><i class="${active >= 3 ? "is-done" : active === 2 ? "is-active" : ""}"></i></div>`;
  }

  function primary(label, action, extra) {
    return `<button class="primary" type="button" data-action="${action}"${extra || ""}>${label}</button>`;
  }

  function secondary(label, action, extra) {
    return `<button class="secondary" type="button" data-action="${action}"${extra || ""}>${label}</button>`;
  }

  function textButton(label, action, extra) {
    return `<button class="text-button" type="button" data-action="${action}"${extra || ""}>${label}</button>`;
  }

  function toggle(action, on, label, extra) {
    return `<button class="toggle${on ? " is-on" : ""}" type="button" data-action="${action}" role="switch" aria-checked="${on}" aria-label="${label}"${extra || ""}></button>`;
  }

  function detailHead(title, action = "settings-back") {
    return `<div class="detail-head"><button class="icon-back" type="button" data-action="${action}" aria-label="Back">${icon("back")}</button><h1>${title}</h1><span></span></div>`;
  }

  function optionCard(label, copy, selected, action, value) {
    return `<button class="option-card${selected ? " is-selected" : ""}" type="button" data-action="${action}" data-value="${value}" aria-pressed="${selected}"><span><strong>${label}</strong><small>${copy}</small></span><i></i></button>`;
  }

  function bottomNav(active) {
    return `<nav class="bottom-nav" aria-label="Primary navigation">
      <button type="button" data-action="go-home" class="${active === "home" ? "active" : ""}" ${active === "home" ? 'aria-current="page"' : ""}>${icon("home")}<span>Home</span></button>
      <button type="button" data-action="open-run" class="${active === "run" ? "active" : ""}" ${active === "run" ? 'aria-current="page"' : ""}>${icon("run")}<span>Your Run</span></button>
      <button type="button" data-action="open-settings" class="${active === "settings" ? "active" : ""}" ${active === "settings" ? 'aria-current="page"' : ""}>${icon("settings")}<span>Settings</span></button>
    </nav>`;
  }

  function keypad(prefix, input) {
    const keyAction = prefix ? `${prefix}-digit` : "math-digit";
    const backAction = prefix ? `${prefix}-backspace` : "math-backspace";
    const submitAction = prefix ? `${prefix}-submit` : "math-submit";
    return `<div class="keypad" aria-label="Number keypad">
      ${[1,2,3,4,5,6,7,8,9].map((digit) => `<button class="key" type="button" data-action="${keyAction}" data-value="${digit}">${digit}</button>`).join("")}
      <button class="key key--plain" type="button" data-action="${backAction}" aria-label="Delete last digit">${icon("backspace")}</button>
      <button class="key" type="button" data-action="${keyAction}" data-value="0">0</button>
      <button class="key key--submit" type="button" data-action="${submitAction}" aria-label="Submit answer" ${input ? "" : "disabled"}>${icon("check")}</button>
    </div>`;
  }

  function riddleOptions(riddle, action, wrongIndex) {
    return `<div class="riddle-options">${riddle.options.map((option, index) => `
      <button class="riddle-option${wrongIndex === index ? " is-wrong" : ""}" type="button" data-action="${action}" data-index="${index}">
        <span>${letters[index]}</span>${escapeHtml(option)}
      </button>`).join("")}</div>`;
  }

  function wrongRiddleOption(riddle, wrongIndex) {
    const index = Number.isInteger(wrongIndex) ? wrongIndex : 0;
    return `<div class="riddle-options"><div class="riddle-option is-wrong" aria-label="Incorrect answer: ${escapeHtml(riddle.options[index])}"><span>${letters[index]}</span>${escapeHtml(riddle.options[index])}</div></div>`;
  }

  function wave(active) {
    return `<span class="sound-wave${active ? " is-playing" : ""}" aria-hidden="true">${Array.from({ length: 11 }, (_, index) => `<i style="--bar:${index}"></i>`).join("")}</span>`;
  }

  function soundChoice(preset, state, action) {
    const selected = state.soundId === preset.id;
    const playing = state.previewingSound === preset.id;
    return `<button class="sound-choice sound-choice--${preset.color}${selected ? " is-selected" : ""}" type="button" data-action="${action}" data-sound="${preset.id}" aria-pressed="${selected}"><i></i><span>${preset.name}</span>${playing ? "<b>PLAYING</b>" : ""}</button>`;
  }

  function screen08(state) {
    return `<section class="screen" data-screen-id="08">${ambient("rose")}${ambient("lilac")}${status(state)}
      <div class="screen-body screen-body--center welcome-body">
        <span class="eyebrow">DRAMA ALARM</span>
        <div class="brand-stage" aria-hidden="true">${morningArt("welcome-art")}</div>
        <h1 class="screen-title">Every morning<br>deserves an entrance.</h1>
        <p class="screen-copy">Your sound. Two little acts.<br>A morning that feels like you.</p>
        <div class="arrival-card"><i class="arrival-card__pulse"></i><div><strong>Sound check included</strong><span>You’ll hear and set tomorrow’s alarm before saving it.</span></div></div>
        <div class="button-stack">${primary("Find your morning mood", "take-stage")}<p class="privacy-line">Two free themes · no account needed</p></div>
      </div>
    </section>`;
  }

  function screen17(state) {
    const statusCopy = state.permissionStatus === "denied" ? "Notifications are currently blocked" : "You stay in control of every alert";
    return `<section class="screen" data-screen-id="17">${ambient("gold")}${status(state)}
      <div class="screen-body screen-body--center">
        <span class="eyebrow">SETUP · 1 OF 3</span>
        <div class="permission-mark permission-mark--live" aria-hidden="true"><i></i></div>
        <h1 class="screen-title permission-title">Let the alarm in</h1>
        <p class="screen-copy">Allow browser notifications for the test. The alarm itself only runs while this tab is open.</p>
        <div class="permission-list"><p><i></i><span><strong>Only alarms you create</strong><small>No marketing notifications</small></span></p><p><i></i><span><strong>${statusCopy}</strong><small>Change it anytime in Settings</small></span></p><p><i></i><span><strong>No health access</strong><small>Your choices stay on this device</small></span></p></div>
        <div class="button-stack">${primary("Allow alarm notifications", "allow-access")}${textButton("Continue without notifications", "permission-not-now")}</div>
      </div>
    </section>`;
  }

  function screen18(state) {
    if (state.rehearsalMode === "sound") {
      const selected = soundById(state.soundId);
      const playing = state.previewingSound === selected.id;
      const includedSounds = soundPresets.filter((preset) => !preset.premium);
      return `<section class="screen" data-screen-id="18">${ambient(selected.color)}${status(state)}
        <div class="screen-body sound-rehearsal">
          <div class="screen-head"><div><span class="eyebrow">SETUP · 2 OF 3</span><h1>Sound check</h1></div><span class="sound-level">${state.masterVolume}% MAX</span></div>
          ${progress(0)}
          <div class="sound-hero sound-hero--${selected.color}"><i class="sound-hero__halo"></i><div class="sound-hero__disc">${wave(playing)}</div><span class="eyebrow">${selected.detail}</span><h2>${selected.name}</h2><p>${selected.mood}</p></div>
          <div class="sound-choice-grid">${includedSounds.map((preset) => soundChoice(preset, state, "select-onboarding-sound")).join("")}</div>
          <label class="volume-control" for="rehearsal-volume"><span>Maximum alarm volume</span><output data-volume-output="rehearsal-volume">${state.masterVolume}%</output><input id="rehearsal-volume" type="range" min="25" max="100" step="1" value="${state.masterVolume}"></label>
          <div class="button-stack sound-setup-actions">${secondary(playing ? "Stop preview" : `Preview ${selected.name}`, playing ? "stop-preview" : "preview-onboarding-sound", ` data-sound="${selected.id}"`)}${primary("This sound works · continue", "rehearsal-sound-continue")}</div>
        </div>
      </section>`;
    }
    if (state.rehearsalMode === "riddle") {
      const riddle = riddles[0];
      return `<section class="screen" data-screen-id="18">${ambient("lilac")}${status(state)}
        <div class="screen-body">
          <div class="screen-head"><div><span class="eyebrow">SETUP · 3 OF 3</span><h1>Rehearsal · Finale</h1></div><span class="sound-level">SOUND GENTLE</span></div>
          ${progress(2)}
          <span class="eyebrow finale-label">THE FINALE</span>
          <h2 class="riddle-question rehearsal-question">${escapeHtml(riddle.question)}</h2>
          <p class="screen-copy rehearsal-copy">Pick one answer. A wrong choice keeps the rehearsal going.</p>
          ${riddleOptions(riddle, "rehearsal-riddle", state.rehearsalWrong)}
        </div>
      </section>`;
    }
    return `<section class="screen" data-screen-id="18">${status(state)}
      <div class="screen-body screen-body--center">
        <div class="screen-head full-width"><div><span class="eyebrow">SETUP · 3 OF 3</span><h1>Rehearsal · Act 1</h1></div><span class="sound-level">SOUND GENTLE</span></div>
        ${progress(1)}
        <p class="screen-copy rehearsal-intro">This is exactly how tomorrow will feel.</p>
        <div class="math-equation">18 + 7</div>
        <div class="math-input" aria-label="Current rehearsal answer">${state.rehearsalInput || ""}</div>
        <p class="math-hint${state.rehearsalError ? " math-hint--wrong" : ""}">${state.rehearsalError || "Finish the answer, then meet The Finale."}</p>
        ${keypad("rehearsal", state.rehearsalInput)}
      </div>
    </section>`;
  }

  function screen09(state) {
    const selected = soundById(state.soundId);
    return `<section class="screen" data-screen-id="09">${ambient("gold")}${status(state)}
      <div class="screen-body screen-body--center"><span class="eyebrow">REHEARSAL COMPLETE</span><div class="bravo-burst bravo-burst--compact"><strong>Bravo!</strong></div><p class="screen-copy">You heard the alarm, cleared both acts<br>and chose ${selected.name}.</p>
        <div class="rehearsal-summary"><p><i></i><span>Notifications</span><strong>${state.permission ? "Ready" : "Off"}</strong></p><p><i></i><span>Alarm sound</span><strong>${selected.name}</strong></p><p><i></i><span>Maximum volume</span><strong>${state.masterVolume}%</strong></p></div>
        <div class="button-stack">${primary("Set my first alarm", "set-first-alarm")}</div>
      </div>
    </section>`;
  }

  function alarmCard(alarm, state) {
    const display = alarmTime(alarm.time);
    const sound = soundById(alarm.soundId);
    return `<article class="alarm-card${alarm.enabled ? "" : " is-paused"}">
      <div class="alarm-card__top"><button class="alarm-card__edit" type="button" data-action="edit-alarm" data-id="${escapeHtml(alarm.id)}" aria-label="Edit ${escapeHtml(alarm.label)}"><span class="alarm-time">${display.time}<small>${display.period}</small></span><span class="alarm-label">${escapeHtml(alarm.label)}</span></button>${toggle("toggle-alarm", alarm.enabled, `${alarm.label} ${alarm.enabled ? "enabled" : "paused"}`, ` data-id="${escapeHtml(alarm.id)}"`)}</div>
      <button class="alarm-card__details" type="button" data-action="edit-alarm" data-id="${escapeHtml(alarm.id)}"><span class="alarm-meta">${dayLabel(alarm.days)} · ${sound.name} · up to ${alarm.maxVolume}%</span><span class="tags"><span class="tag">Math · ${alarm.difficulty}</span>${alarm.riddle ? '<span class="tag tag--lilac">Riddle finale</span>' : ""}${alarm.check ? '<span class="tag tag--gold">Wake-up check</span>' : ""}</span></button>
    </article>`;
  }

  function screen01(state) {
    const next = state.nextAlarm;
    const now = new Date(state.now || Date.now());
    const hour = now.getHours();
    const greeting = hour < 5 ? "A quiet night." : hour < 12 ? "Good morning." : hour < 18 ? "Good afternoon." : "Good evening.";
    const week = Array.from({ length: 7 }, (_, index) => { const date = new Date(now); date.setDate(now.getDate() + index - 3); return date; });
    const nextTime = next ? alarmTime(next.alarm.time) : null;
    return `<section class="screen" data-screen-id="01">${ambient("rose")}${ambient("lilac")}${status(state)}
      <div class="screen-body screen-body--scroll home-body">
        <div class="v5-topline"><div><span class="v5-date">${new Intl.DateTimeFormat("en-US", { weekday: "long", month: "short", day: "numeric" }).format(now)}</span><h1 class="v5-greeting">${greeting}</h1></div><button class="quiet-action" type="button" data-action="new-alarm" aria-label="Add alarm">${icon("plus")}</button></div>
        <div class="calendar-week" aria-label="This week">${week.map((date, index) => `<div class="calendar-day${index === 3 ? " is-today" : ""}" ${index === 3 ? 'aria-current="date"' : ""}><span>${index === 3 ? "Today" : new Intl.DateTimeFormat("en-US", { weekday: "short" }).format(date)}</span><strong>${date.getDate()}</strong><i></i></div>`).join("")}</div>
        <button class="next-show-card" type="button" data-action="${next ? "edit-alarm" : "new-alarm"}"${next ? ` data-id="${escapeHtml(next.alarm.id)}"` : ""} aria-label="${next ? `Edit next alarm, ${nextTime.time} ${nextTime.period}` : "Set your next alarm"}">
          <div class="next-show-kicker">${icon("sun")}<span>${next ? "Your next entrance" : "Your morning, your stage"}</span>${icon("chevron")}</div>
          <div class="next-show-orbit"><i></i><span class="orbit-note">${next ? "CURTAIN UP IN" : "ALL QUIET"}</span><strong class="next-show-time">${next ? next.countdown : "A new day"}</strong><span class="next-show-caption">${next ? `${next.dayLabel} · ${nextTime.time} ${nextTime.period}` : "Set an alarm and make it yours"}</span></div>
          <span class="next-show-label">${next ? escapeHtml(next.alarm.label) : "A gentle start is waiting."}</span>
        </button>
        <div class="section-heading"><h2>My alarms</h2><button class="text-button" type="button" data-action="new-alarm">Add new ${icon("plus")}</button></div>
        <div class="alarm-list">${state.alarms.length ? state.alarms.map((alarm) => alarmCard(alarm, state)).join("") : `<div class="empty-alarm">${icon("bell")}<strong>Your first show is waiting</strong><p>Choose a time, a sound and a little resolve.</p>${secondary("Create my first alarm", "new-alarm")}</div>`}</div>
        <button class="rehearsal-card" type="button" data-action="test-alarm"><span class="rehearsal-card__icon">${icon("play")}</span><span><strong>Today’s rehearsal</strong><small>Hear it. Try both acts. Take a bow.</small></span>${icon("chevron")}</button>
        <div class="morning-note">${icon("leaf")}<span><strong>A small cue for tomorrow</strong><small>Leave your phone a few steps from bed. Give your first act some room.</small></span></div>
      </div>
      ${bottomNav("home")}
    </section>`;
  }

  function screen02(state) {
    const alarm = state.alarm;
    const days = ["S", "M", "T", "W", "T", "F", "S"];
    const selected = soundById(state.soundId);
    return `<section class="screen" data-screen-id="02">${ambient("gold")}${status(state)}
      <div class="screen-body screen-body--scroll editor-body">
        <div class="screen-head sticky-head"><button class="text-button compact-button" type="button" data-action="go-home">Cancel</button><h1>${state.editorMode === "edit" ? "Edit Alarm" : "New Alarm"}</h1><button class="text-button compact-button save-link" type="button" data-action="save-alarm">Save</button></div>
        <label class="alarm-label-field" for="alarm-label"><span class="eyebrow">ALARM NAME</span><input id="alarm-label" type="text" maxlength="32" value="${escapeHtml(alarm.label)}" placeholder="Morning Show" autocomplete="off"></label>
        <label class="time-field"><span class="sr-only">Alarm time</span><input class="editor-time" id="alarm-time" type="time" value="${alarm.time}" aria-label="Alarm time"></label>
        <div class="days" aria-label="Repeat days">${days.map((day, index) => `<button class="day${alarm.days.includes(index) ? " is-on" : ""}" type="button" data-action="toggle-day" data-index="${index}" aria-pressed="${alarm.days.includes(index)}">${day}</button>`).join("")}</div>
        <span class="eyebrow section-label">WAKE-UP SHOW</span>
        <div class="form-card"><div class="form-row"><label>Difficulty</label><div class="segment">${["Gentle", "Classic", "Diva"].map((level) => `<button type="button" data-action="set-difficulty" data-value="${level}" class="${alarm.difficulty === level ? "is-on" : ""}">${level}</button>`).join("")}</div></div><div class="form-row"><label>Riddle finale <small>· after Math</small></label>${toggle("toggle-riddle", alarm.riddle, "Riddle finale")}</div><div class="form-row"><label>Wake-up check <small>· ${alarm.checkDelay || 5} min</small></label>${toggle("toggle-check", alarm.check, "Wake-up check")}</div></div>
        <span class="eyebrow section-label">SOUND</span>

      }, overrides || {});
    }

    clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    localDateKey(date = new Date()) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    monthKey(date = new Date()) {
      return this.localDateKey(date).slice(0, 7);
    }

    initialState() {
      let saved = {};
      for (const key of ["drama-alarm-v5", "drama-alarm-v4", "drama-alarm-v3", "drama-alarm-v2", "drama-alarm-demo"]) {
        try {
          const candidate = JSON.parse(localStorage.getItem(key) || "null");
          if (candidate && typeof candidate === "object" && !Array.isArray(candidate)) { saved = candidate; break; }
        } catch (_) {}
      }
      let alarms = Array.isArray(saved.alarms) ? saved.alarms : [];
      if (!alarms.length && saved.alarm && saved.onboarded) alarms = [this.defaultAlarm(saved.alarm)];
      alarms = alarms.map((alarm) => this.defaultAlarm(alarm));
      const activeAlarm = alarms[0] ? this.clone(alarms[0]) : this.defaultAlarm();
      const savedSoundId = saved.soundId || saved.sound || activeAlarm.soundId || "first-light";
      activeAlarm.soundId = soundPresets.some((preset) => preset.id === savedSoundId && !preset.premium) ? savedSoundId : "first-light";
      const notificationPermission = "Notification" in window ? Notification.permission : "unsupported";
      const themeId = themes.some((theme) => theme.id === saved.themeId) ? saved.themeId : saved.onboarded ? "velvet" : "daybreak";
      const emergencyMonth = saved.emergencyMonth || localStorage.getItem("drama-alarm-emergency-month") || this.monthKey();
      const emergencyUses = emergencyMonth === this.monthKey() ? Math.max(0, Number(saved.emergencyUses ?? localStorage.getItem("drama-alarm-emergency-uses") ?? 0) || 0) : 0;
      return {
        screen: saved.onboarded ? "01" : "08",
        previousScreen: "03",
        permission: Boolean(saved.permission),
        permissionStatus: saved.permissionStatus || notificationPermission,
        permissionReturnScreen: "18",
        onboarded: Boolean(saved.onboarded),
        themeId,
        themePreviewId: null,
        pendingThemeId: themeId,
        themeReturn: "onboarding",
        themePreviewReturnScreen: "38",
        themeStudioReturnScreen: "14",
        futureThemeReturnScreen: "38",
        themeOnboardingComplete: Boolean(saved.themeOnboardingComplete || saved.onboarded),
        alarms,
        alarm: activeAlarm,
        editorMode: alarms.length ? "edit" : "new",
        editorError: "",
        soundId: activeAlarm.soundId,
        soundReturnScreen: "14",
        settingsReturnScreen: "14",
        previewingSound: null,
        audioUnlocked: false,
        plan: "Yearly",
        haptics: saved.haptics !== false,
        hapticCues: Object.assign({ ring: true, answer: true, bravo: true }, saved.hapticCues || {}),
        masterVolume: Number(saved.masterVolume || activeAlarm.maxVolume || 72),
        volume: 40,
        math: this.generateMath(activeAlarm.difficulty),
        riddleIndex: 0,
        riddleWrong: 0,
        lastRiddleWrong: null,
        recentRiddles: Array.isArray(saved.recentRiddles) ? saved.recentRiddles.slice(-20) : [],
        rehearsalMode: "sound",
        rehearsalInput: "",
        rehearsalError: "",
        rehearsalWrong: null,
        safetyKind: "math",
        safetyTargetLevel: "Gentle",
        emergencyMonth: this.monthKey(),
        emergencyUses,
        emergencyCode: "",
        testCountdown: 0,
        wakeCheckSeconds: this.fast ? 3 : 60,
        checkMode: false,
        wakeCheckDueAt: 0,
        wakeCheckAlarm: null,
        wakeCheckReturnScreen: "01",
        sessionKind: "alarm",
        challengeStartedAt: 0,
        challengeMistakes: 0,
        lastResult: null,
        selectedAchievement: { name: "Morning Debut", copy: "Completed your first local wake-up show", count: "01", earned: true },
        history: Array.isArray(saved.history) ? saved.history.slice(-90) : [],
        nextAlarm: null,
        now: new Date(),
        fast: this.fast,
      };
    }

    bind() {
      document.addEventListener("click", (event) => {
        const trigger = event.target.closest("[data-action]");
        if (!trigger || trigger.disabled) return;
        event.preventDefault();
        Promise.resolve(this.handle(trigger.dataset.action, trigger)).catch(() => this.toast("That action could not finish. Please try again."));
      });
      document.addEventListener("input", (event) => {
        const target = event.target;
        if (target.id === "alarm-time") {
          this.state.alarm.time = target.value || "06:30";
          this.state.editorError = "";
        } else if (target.id === "alarm-label") {
          this.state.alarm.label = target.value.slice(0, 32);
          this.state.editorError = "";
        } else if (["max-volume", "rehearsal-volume", "strategy-volume"].includes(target.id)) {
          this.state.masterVolume = Number(target.value);
          this.state.alarm.maxVolume = this.state.masterVolume;
          this.soundEngine.setPreviewLevel(this.state.masterVolume);
          const output = document.querySelector(`[data-volume-output="${target.id}"]`);
          if (output) output.textContent = `${this.state.masterVolume}%`;
        } else if (target.id === "emergency-stop-code") {
          this.state.emergencyCode = target.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
          target.value = this.state.emergencyCode;
        }
      });
      document.addEventListener("change", (event) => {
        if (["max-volume", "rehearsal-volume", "strategy-volume"].includes(event.target.id)) {
          if (event.target.id === "strategy-volume" && this.state.settingsReturnScreen !== "02") this.syncCurrentAlarm();
          else this.save();
        }
      });
      document.addEventListener("pointerdown", (event) => {
        const hold = event.target.closest("[data-hold]");
        if (hold) { event.preventDefault(); this.startHold(hold); }
      });
      ["pointerup", "pointercancel"].forEach((name) => document.addEventListener(name, () => this.cancelHold()));
      document.addEventListener("pointerleave", (event) => {
        if (this.holdElement && event.target === this.holdElement) this.cancelHold();
      }, true);
      document.addEventListener("keydown", (event) => this.handleKeyboard(event));
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && this.state.previewingSound) this.stopPreview();
        if (!document.hidden) {
          this.checkWakeCheckDue();
          this.checkScheduledAlarm(new Date());
        }
      });
      window.addEventListener("beforeunload", () => this.soundEngine.destroy());
    }

    startClock() {
      clearInterval(this.clockTimer);
      this.clockTimer = setInterval(() => {
        this.state.now = new Date();
        this.ensureEmergencyMonth();
        this.checkWakeCheckDue();
        this.checkScheduledAlarm(this.state.now);
        if (["01", "19"].includes(this.state.screen)) this.render();
      }, this.fast ? 1000 : 15000);
      this.checkScheduledAlarm(this.state.now);
    }

    checkScheduledAlarm(now) {
      if (!this.state.onboarded || !this.state.alarms.length) return;
      if (challengeScreens.has(this.state.screen)) return;
      const hour = String(now.getHours()).padStart(2, "0");
      const minute = String(now.getMinutes()).padStart(2, "0");
      const alarm = this.state.alarms.find((item) => item.enabled && item.days.includes(now.getDay()) && item.time === `${hour}:${minute}`);
      if (!alarm) return;
      const minuteKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${hour}:${minute}-${alarm.id}`;
      if (this.lastScheduledTrigger === minuteKey) return;
      this.lastScheduledTrigger = minuteKey;
      this.closeModal();
      this.state.alarm = this.clone(alarm);
      this.state.soundId = alarm.soundId;
      this.state.masterVolume = alarm.maxVolume;
      this.resetChallenge("alarm");
      this.go("16", { ring: true });
      this.notifyAlarm();
    }

    updateDerivedState() {
      this.state.nextAlarm = this.findNextAlarm();
      const preset = soundPresets.find((item) => item.id === this.state.soundId) || soundPresets[0];
      this.state.soundName = preset.name;
      this.state.soundPresets = soundPresets;
      this.state.runSummary = this.calculateRunSummary();
      this.ensureEmergencyMonth();
      this.state.themes = themes;
      this.state.displayThemeId = this.state.themePreviewId || this.state.themeId;
      // Both names are exposed for the v5 screen templates; themePreviewId is canonical.
      this.state.previewThemeId = this.state.themePreviewId;
      this.state.activeTheme = themes.find((theme) => theme.id === this.state.themeId) || themes[1];
      this.state.selectedTheme = themes.find((theme) => theme.id === this.state.pendingThemeId) || this.state.activeTheme;
      this.state.previewTheme = themes.find((theme) => theme.id === this.state.themePreviewId) || this.state.selectedTheme;
      this.state.historyDays = Array.from(new Set(this.state.history.map((item) => item.localDate || this.localDateKey(new Date(item.at)))));
    }

    render() {
      this.updateDerivedState();
      this.applyThemeToDocument();
      const app = document.getElementById("app");
      const previousBody = app.querySelector(".screen-body");
      const scrollTop = previousBody?.scrollTop || 0;
      const sameScreen = this.renderedScreen === this.state.screen;
      const sameContent = sameScreen && (this.state.screen !== "18" || this.renderedRehearsalMode === this.state.rehearsalMode);
      app.innerHTML = Screens.render(this.state.screen, this.state);
      if (sameContent) {
        // State-only updates must not replay page/card entrance animations.
        const screen = app.querySelector(".screen");
        if (screen) {
          screen.classList.add("screen--state-update");
          screen.style.animation = "none";
          screen.querySelectorAll(".screen-body, .alarm-card, .sound-card, .settings-card, .premium-sound-card, .sound-upgrade-strip, .sound-library-teaser, .bottom-nav button.active .nav-mark").forEach((element) => { element.style.animation = "none"; });
        }
        const body = app.querySelector(".screen-body");
        if (body) body.scrollTop = scrollTop;
      }
      this.renderedScreen = this.state.screen;
      this.renderedRehearsalMode = this.state.rehearsalMode;
      document.getElementById("scene-list").innerHTML = Screens.renderSceneList(this.state.screen);
      document.querySelectorAll('[data-action="toggle-scenes"]').forEach((button) => button.setAttribute("aria-expanded", document.getElementById("scene-panel").classList.contains("is-open")));
      const screenName = screenCatalog.flatMap((group) => group.items).find(([id]) => id === this.state.screen)?.[1] || "Drama Alarm";
      const announcer = document.getElementById("screen-announcer");
      if (announcer) announcer.textContent = screenName;
    }

    go(screen, options) {
      const opts = options || {};
      clearTimeout(this.transitionTimer);
      if (this.state.screen === "22") clearInterval(this.wakeTimer);
      if (!opts.keepPreview) this.stopPreview(false);
      if (["37", "38", "39"].includes(this.state.screen) && !["37", "38", "39", "40"].includes(screen)) this.state.themePreviewId = null;
      this.state.screen = screen;
      this.render();
      if (screen === "16") {
        this.soundEngine.cue("curtain");
        if (opts.ring !== false) this.startRinging();
        this.transitionTimer = setTimeout(() => this.go("03", { keepPreview: true }), this.fast ? 180 : 1500);
      }
      if (screen === "20") {
        this.transitionTimer = setTimeout(() => {
          if (this.state.screen !== "20") return;
          if (this.state.riddleWrong >= 3) this.openSafety("riddle");
          else this.nextRiddle();
        }, this.fast ? 180 : 1200);
      }
      if (screen === "22") {
        clearTimeout(this.scheduledWakeTimer);
        this.state.wakeCheckDueAt = 0;
        this.startWakeCountdown();
      }
      document.getElementById("scene-panel").classList.remove("is-open");
    }

    async handle(action, element) {

        "jump-screen": () => { this.stopRinging(); this.go(element.dataset.screen, { ring: false }); },
