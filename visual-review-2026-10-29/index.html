<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="疯狂闹钟下一版 SVG 视觉确认画布：双主题、三档难度、题库选择、原创角色与动效分镜。基于 7.2，不是可执行产品。">
  <title>疯狂闹钟 · 下一版视觉提案</title>
  <style>
    :root{--bg:#f5f8f6;--paper:#fff;--ink:#22352e;--muted:#4f665c;--accent:#216b51;--tint:#e0f3e9;--line:#cbd8d0;--rose:#a73558;--grid:#758c7c18;font-family:"Avenir Next","Helvetica Neue","PingFang SC",sans-serif;color:var(--ink);background:var(--bg);color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
    button,select,a{font:inherit;-webkit-tap-highlight-color:transparent}
    button,select{color:var(--ink)}
    button,a,select{touch-action:manipulation}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.55}
    button:focus-visible,a:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    button:hover:not(:disabled),.tool-link:hover{background:var(--tint)}
    button:active:not(:disabled),.tool-link:active{box-shadow:inset 0 0 0 2px var(--accent)}
    a{color:var(--accent);text-underline-offset:4px}
    .page{height:100dvh;min-height:520px;display:flex;flex-direction:column}
    header{position:sticky;top:0;z-index:3;background:#f5f8f6f2;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:22px 28px 16px;flex:none}
    .heading{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
    .eyebrow{margin:0 0 7px;font-size:11px;font-weight:750;letter-spacing:.15em;color:var(--accent)}
    h1{font-size:clamp(25px,3vw,38px);line-height:1.2;letter-spacing:-.04em;margin:0;font-weight:700}
    .intro{font-size:14px;line-height:1.55;color:var(--muted);margin:9px 0 0;text-wrap:pretty}
    .edition{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:9px 12px;white-space:nowrap;align-self:center;color:var(--muted);font-size:12px;line-height:1.5}
    .edition strong{color:var(--ink);display:block;font-weight:650}
    .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
    .view-switch{display:flex;background:#e8eee9;border:1px solid var(--line);padding:3px;border-radius:14px;gap:3px}
    .view-switch button{min-height:38px;padding:7px 14px;border:0;background:transparent;border-radius:10px;font-size:14px;font-weight:650;white-space:nowrap}
    .view-switch button[aria-pressed="true"]{background:var(--paper);box-shadow:0 2px 8px #22352e0c;color:var(--accent)}
    .zoom-tools{display:flex;gap:5px;align-items:center}
    .icon-tool,.tool-link,.motion-tool,.zoom-picker,.filter-picker{background:var(--paper);border:1px solid var(--line);border-radius:12px;min-height:44px;line-height:1.2}
    .icon-tool{width:44px;font-size:23px;display:grid;place-items:center;padding:0}
    .zoom-picker{width:120px;padding:8px 30px 8px 11px;font-size:14px}
    .tool-link,.motion-tool{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 13px;font-size:14px;text-decoration:none;font-weight:600;white-space:nowrap}
    .tool-link svg,.motion-tool svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .download{margin-left:auto}
    .sections{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:11px 28px;background:#f5f8f6e8;border-bottom:1px solid var(--line);scrollbar-width:thin;flex:none}
    .sections button{flex:none;border:0;background:transparent;border-radius:9px;padding:9px 12px;min-height:38px;font-size:13px;white-space:nowrap;color:var(--muted)}
    .sections button[aria-current="true"]{color:var(--accent);font-weight:700;background:var(--tint)}
    .section-prefix{font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--muted);white-space:nowrap;margin-right:8px}
    main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
    .viewport{overflow:auto;flex:1;min-height:0;cursor:grab;overscroll-behavior:contain;position:relative;scrollbar-color:#9aafa1 #edf2ee;scrollbar-width:thin}
    .viewport.dragging{cursor:grabbing;user-select:none}
    .stage{position:relative;padding:24px;min-width:100%;min-height:100%;width:max-content}
    .board-holder{position:relative;overflow:hidden;background:var(--paper);box-shadow:0 12px 36px #22352e10;border:1px solid #dce5de;border-radius:8px}
    #board{display:block;width:100%;height:100%;pointer-events:none;contain:layout paint}
    .loading{position:absolute;top:30px;left:30px;right:30px;color:var(--muted);font-size:14px;line-height:1.5;background:#fffffff0;border:1px solid var(--line);padding:15px 18px;border-radius:12px}
    .loading[hidden]{display:none}
    .status-bar{min-height:38px;padding:9px 28px;background:#f5f8f6f2;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none;color:var(--muted);font-size:12px;line-height:1.5}
    .status-bar .scope{color:var(--rose)}
    .gallery-shell{overflow-y:auto;flex:1;min-height:0;scrollbar-width:thin}
    .gallery-tools{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:24px 28px 0}
    .gallery-tools p{font-size:14px;color:var(--muted);margin:0;line-height:1.5}
    .filter-picker{padding:10px 35px 10px 12px;font-size:14px;flex:none}
    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:38px 32px;padding:28px 28px 60px}
    figure{margin:0;display:grid;justify-items:center;align-content:start;gap:12px;min-width:0}
    figcaption{width:min(390px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px;font:700 11px "Avenir Next",sans-serif;letter-spacing:.08em;line-height:1.5;color:var(--muted)}
    figcaption .theme-tag{font-size:10px;font-weight:650;padding:4px 8px;border-radius:8px;background:#e0f3e9;color:var(--accent);letter-spacing:0;white-space:nowrap}
    figcaption .theme-tag.velvet{background:#f8e0e8;color:var(--rose)}
    .screen-preview{width:min(390px,100%);aspect-ratio:390/844;border-radius:36px;overflow:hidden;background:var(--paper);box-shadow:0 10px 30px #22352e13;border:1px solid #d5dfd8}
    .screen-preview object{display:block;width:100%;height:100%;pointer-events:none}
    .screen-note{width:min(390px,100%);color:var(--muted);font-size:13px;line-height:1.65;min-height:2em;margin:0;text-wrap:pretty}
    .screen-link{font-size:13px;font-weight:650;min-height:36px;display:inline-flex;align-items:center;gap:6px}
    .screen-link span{font-size:16px}
    .empty-note{padding:40px 28px;font-size:15px;color:var(--muted)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    [hidden]{display:none!important}
    @media(min-width:1800px){header{padding-inline:40px}.sections{padding-inline:40px}.status-bar{padding-inline:40px}.stage{padding:32px}}
    @media(max-width:700px){header{padding:17px 16px 12px}.heading{gap:12px}.edition{font-size:10px;padding:7px 8px;border-radius:10px}.intro{font-size:13px;line-height:1.55;max-width:520px}.eyebrow{font-size:9px;letter-spacing:.1em}h1{font-size:25px;line-height:1.25}.toolbar{gap:7px;margin-top:13px}.view-switch button{font-size:13px;padding:7px 10px;min-height:36px}.zoom-picker{width:100px;font-size:13px;padding-left:8px}.icon-tool{width:38px;min-height:40px}.zoom-tools{gap:4px}.tool-link,.motion-tool{font-size:12px;min-height:40px;padding:9px 10px;gap:5px}.download{margin-left:0}.sections{padding:8px 12px;gap:2px}.sections button{font-size:12px;padding:8px 10px;min-height:36px}.section-prefix{display:none}.stage{padding:12px}.status-bar{padding:8px 16px;font-size:11px;gap:8px}.status-bar .scope{max-width:43%;text-align:right}.gallery-tools{padding:18px 16px 0;align-items:flex-start}.gallery-tools p{font-size:12px}.filter-picker{font-size:12px;min-height:40px;padding-left:9px}.gallery{padding:22px 16px 45px;gap:30px}.screen-preview{border-radius:32px}.screen-note{min-height:0}}
    @media(max-width:390px){h1{font-size:23px}.edition{display:none}.zoom-picker{width:92px}.toolbar{column-gap:6px}.tool-link,.motion-tool{padding-inline:9px}.status-bar .scope{display:none}.intro{font-size:12px}.view-switch button{padding-inline:9px}}
    @media(max-width:700px){header{padding:12px 16px 10px}.intro,.edition{display:none}.eyebrow{margin-bottom:5px}h1{font-size:23px}.toolbar{margin-top:10px}.sections{padding-block:5px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="heading">
        <div>
          <p class="eyebrow">DRAMA ALARM / VISUAL REVIEW</p>
          <h1>疯狂闹钟 · 下一版视觉提案</h1>
          <p class="intro">三档难度、主题题库与清晨剧组，在同一张 SVG 大画布里对齐。两套免费主题沿用现有组件语言。</p>
        </div>
        <div class="edition"><strong>基线 7.2 · 视觉确认稿</strong>2026.10.29 / 非可执行产品</div>
      </div>
      <div class="toolbar" aria-label="画布工具">
        <div class="view-switch" role="group" aria-label="查看方式">
          <button id="canvas-view" type="button" aria-pressed="true" aria-controls="canvas-panel">大画布</button>
          <button id="gallery-view" type="button" aria-pressed="false" aria-controls="gallery-panel">单屏细看</button>
        </div>
        <div class="zoom-tools" id="zoom-tools" role="group" aria-label="缩放画布">
          <button class="icon-tool" id="zoom-out" type="button" aria-label="缩小画布">−</button>
          <label class="sr-only" for="zoom">画布缩放比例</label>
          <select class="zoom-picker" id="zoom">
            <option value="fit" selected>适应宽度</option>
            <option value="0.3">30%</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1">100%</option>
            <option value="1.25">125%</option>
          </select>
          <button class="icon-tool" id="zoom-in" type="button" aria-label="放大画布">＋</button>
        </div>
        <button class="motion-tool" id="motion" type="button" aria-pressed="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path id="motion-glyph" d="M7 5v10M13 5v10"/></svg>
          <span id="motion-label">暂停动效</span>
        </button>
        <a class="tool-link download" href="board.svg" download="疯狂闹钟-下一版视觉画布.svg">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-4-4 4 4 4-4M4 13v4h12v-4"/></svg>下载 SVG
        </a>
        <a class="tool-link" href="board.svg" target="_blank" rel="noopener">打开原图 ↗</a>
      </div>
    </header>
    <nav class="sections" id="section-nav" aria-label="画布分区">
      <span class="section-prefix">SECTIONS</span>
      <button type="button" data-section="section-system" aria-current="true">01 组件与风格</button>
      <button type="button" data-section="section-cast">02 角色与动效</button>
      <button type="button" data-section="section-onboarding">03 首次引导</button>
      <button type="button" data-section="section-library">04 主题题库</button>
      <button type="button" data-section="section-challenge">05 挑战过程</button>
      <button type="button" data-section="section-finish">06 完成与复查</button>
      <button type="button" data-section="section-daily">07 日常与设置</button>
    </nav>
    <main>
      <section class="viewport" id="canvas-panel" tabindex="0" aria-label="SVG 大画布，可用方向键滚动" aria-describedby="canvas-help">
        <div class="stage" id="stage">
          <div class="board-holder" id="board-holder" style="width:1000px;height:2967px">
            <object id="board" data="board.svg" type="image/svg+xml" aria-label="疯狂闹钟下一版完整 SVG 视觉画布">
              <p>当前浏览器未能嵌入 SVG，<a href="board.svg">直接打开完整 SVG 画布</a>。</p>
            </object>
          </div>
          <div class="loading" id="loading" role="status">正在载入矢量画布…</div>
        </div>
      </section>
      <section class="gallery-shell" id="gallery-panel" aria-label="单屏 SVG 画廊" hidden>
        <div class="gallery-tools">
          <p id="gallery-count">正在读取单屏清单…</p>
          <label class="sr-only" for="theme-filter">筛选主题</label>
          <select class="filter-picker" id="theme-filter">
            <option value="all">全部主题</option>
            <option value="daybreak">Daybreak 薄荷晨光</option>
            <option value="velvet">Velvet Stage 奶油粉紫</option>
          </select>
        </div>
        <div class="gallery" id="gallery"></div>
        <p class="empty-note" id="gallery-error" hidden></p>
      </section>
      <footer class="status-bar">
        <span id="canvas-help">拖动画布或滚动查看 · 100% 阅读细节 · ＋ / − 缩放，0 适宽</span>
        <span class="scope" id="canvas-status" aria-live="polite">仅视觉提案，线上 7.2 不变</span>
      </footer>
    </main>
  </div>
  <script>
    'use strict';
    const board = document.getElementById('board');
    const holder = document.getElementById('board-holder');
    const viewport = document.getElementById('canvas-panel');
    const stage = document.getElementById('stage');
    const zoomSelect = document.getElementById('zoom');
    const loading = document.getElementById('loading');
    const gallery = document.getElementById('gallery');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const state = {width:3060,height:9080,scale:1,mode:'fit',view:'canvas',ready:false,paused:reducedMotion.matches,screens:[],manifestLoaded:false,drag:null};
    const themeName = value => value === 'velvet' ? 'Velvet Stage' : 'Daybreak';
    const svgDocuments = new Set();

    function contentRoot(object) {
      try { return object.contentDocument?.documentElement || null; } catch { return null; }
    }
    function motionFor(root, paused) {
      if (!root) return;
      try {
        const doc = root.ownerDocument;
        let control = doc.getElementById('viewer-motion-control');
        if (!control) {
          control = doc.createElementNS('http://www.w3.org/2000/svg','style');
          control.id = 'viewer-motion-control';
          root.appendChild(control);
        }
        control.textContent = paused ? '*{animation-play-state:paused!important;transition:none!important}' : '';
        if (paused) root.pauseAnimations?.(); else root.unpauseAnimations?.();
      } catch { /* The SVG remains viewable when an optional animation API is absent. */ }
    }
    function applyMotion() {
      const paused = state.paused || reducedMotion.matches;
      for (const root of svgDocuments) motionFor(root, paused);
      const button = document.getElementById('motion');
      button.setAttribute('aria-pressed',String(paused));
      button.disabled = reducedMotion.matches;
      document.getElementById('motion-label').textContent = reducedMotion.matches ? '已减少动态效果' : paused ? '播放动效' : '暂停动效';
      document.getElementById('motion-glyph').setAttribute('d',paused ? 'M7 4l9 6-9 6z' : 'M7 5v10M13 5v10');
    }
    function fitScale() {
      const padding = innerWidth <= 700 ? 24 : innerWidth >= 1800 ? 64 : 48;
      return Math.max(.08,Math.min(1.25,(viewport.clientWidth-padding)/state.width));
    }
    function setScale(value, preserveCenter=true) {
      const old = state.scale;
      const centerX = (viewport.scrollLeft + viewport.clientWidth/2)/old;
      const centerY = (viewport.scrollTop + viewport.clientHeight/2)/old;
      state.mode = value === 'fit' ? 'fit' : 'fixed';
      state.scale = value === 'fit' ? fitScale() : Math.max(.08,Math.min(1.5,Number(value)));
      holder.style.width = `${Math.round(state.width*state.scale)}px`;
      holder.style.height = `${Math.round(state.height*state.scale)}px`;
      const matching = [...zoomSelect.options].find(option=>option.value !== 'fit' && Math.abs(Number(option.value)-state.scale)<.002);
      const oldCustom = zoomSelect.querySelector('[data-custom]');
      if(oldCustom) oldCustom.remove();
      if(state.mode==='fit') zoomSelect.value='fit';
      else if(matching) zoomSelect.value=matching.value;
      else {
        const custom = new Option(`${Math.round(state.scale*100)}%`,String(state.scale));
        custom.dataset.custom='true';zoomSelect.add(custom);zoomSelect.value=custom.value;
      }
      if(preserveCenter) {
        viewport.scrollLeft=Math.max(0,centerX*state.scale-viewport.clientWidth/2);
        viewport.scrollTop=Math.max(0,centerY*state.scale-viewport.clientHeight/2);
      }
      if(state.ready) document.getElementById('canvas-status').textContent=`${state.width.toLocaleString()} × ${state.height.toLocaleString()} SVG · ${Math.round(state.scale*100)}%`;
    }
    function stepZoom(direction) {
      const steps=[.15,.3,.5,.75,1,1.25,1.5];
      const next=direction>0 ? steps.find(value=>value>state.scale+.01) : [...steps].reverse().find(value=>value<state.scale-.01);
      setScale(next ?? (direction>0 ? 1.5 : .15));
    }
    function setView(view) {
      state.view=view;
      viewport.hidden=view!=='canvas';
      document.getElementById('gallery-panel').hidden=view!=='gallery';
      document.getElementById('zoom-tools').hidden=view!=='canvas';
      document.getElementById('section-nav').hidden=view!=='canvas';
      document.getElementById('canvas-view').setAttribute('aria-pressed',String(view==='canvas'));
      document.getElementById('gallery-view').setAttribute('aria-pressed',String(view==='gallery'));
      if(view==='gallery') loadGallery();
      else if(state.mode==='fit') setScale('fit',false);
    }
    board.addEventListener('load',()=>{
      const root=contentRoot(board);
      if(!root || root.localName!=='svg') {
        loading.textContent='画布尚未载入，可刷新页面，或点击“打开原图”。';return;
      }
      const box=root.viewBox?.baseVal;
      if(box?.width>0 && box?.height>0) {state.width=box.width;state.height=box.height;}
      state.ready=true;svgDocuments.add(root);loading.hidden=true;
      setScale(state.mode==='fit'?'fit':state.scale,false);applyMotion();
    });
    board.addEventListener('error',()=>{loading.textContent='画布载入失败，请刷新或直接打开原图。';});
    document.getElementById('canvas-view').addEventListener('click',()=>setView('canvas'));
    document.getElementById('gallery-view').addEventListener('click',()=>setView('gallery'));
    zoomSelect.addEventListener('change',()=>setScale(zoomSelect.value));
    document.getElementById('zoom-out').addEventListener('click',()=>stepZoom(-1));
    document.getElementById('zoom-in').addEventListener('click',()=>stepZoom(1));
    document.getElementById('motion').addEventListener('click',()=>{state.paused=!state.paused;applyMotion();});
    reducedMotion.addEventListener('change',applyMotion);
    document.getElementById('section-nav').addEventListener('click',event=>{
      const button=event.target.closest('[data-section]');
      const root=contentRoot(board);
      if(!button || !root) return;
      const target=root.ownerDocument.getElementById(button.dataset.section);
      if(!target) return;
      const box=target.getBBox();
      const matrix=target.getCTM();
      const point=root.createSVGPoint();point.x=box.x;point.y=box.y;
      const location=matrix ? point.matrixTransform(matrix) : point;
      viewport.scrollTop=Math.max(0,location.y*state.scale+stage.offsetTop-12);
      viewport.scrollLeft=0;
      document.querySelectorAll('[data-section]').forEach(item=>item.setAttribute('aria-current',String(item===button)));
    });
    viewport.addEventListener('pointerdown',event=>{
      if(event.pointerType!=='mouse' || event.button!==0) return;
      state.drag={id:event.pointerId,x:event.clientX,y:event.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};
      viewport.setPointerCapture(event.pointerId);viewport.classList.add('dragging');
    });
    viewport.addEventListener('pointermove',event=>{
      if(!state.drag || state.drag.id!==event.pointerId) return;
      viewport.scrollLeft=state.drag.left-(event.clientX-state.drag.x);
      viewport.scrollTop=state.drag.top-(event.clientY-state.drag.y);
    });
    function endDrag(event) {
      if(state.drag?.id!==event.pointerId) return;
      state.drag=null;viewport.classList.remove('dragging');
      if(viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
    }
    viewport.addEventListener('pointerup',endDrag);
    viewport.addEventListener('pointercancel',endDrag);
    viewport.addEventListener('lostpointercapture',endDrag);
    window.addEventListener('blur',()=>{state.drag=null;viewport.classList.remove('dragging');});
    document.addEventListener('keydown',event=>{
      if(state.view!=='canvas' || event.ctrlKey || event.metaKey || event.altKey || /INPUT|SELECT|TEXTAREA/.test(event.target.tagName)) return;
      if(event.key==='+' || event.key==='=') {event.preventDefault();stepZoom(1);}
      else if(event.key==='-') {event.preventDefault();stepZoom(-1);}
      else if(event.key==='0') {event.preventDefault();setScale('fit');}
      else if(event.key==='Escape' && state.drag) {state.drag=null;viewport.classList.remove('dragging');}
    });
    const resizeObserver=new ResizeObserver(()=>{if(state.view==='canvas' && state.mode==='fit') setScale('fit',false);});
    resizeObserver.observe(viewport);

    const lazyObserver=new IntersectionObserver(entries=>{
      for(const entry of entries) {
        const object=entry.target;
        if(entry.isIntersecting && object.dataset.src) {object.data=object.dataset.src;delete object.dataset.src;}
        const root=contentRoot(object);
        if(root) motionFor(root,state.paused || reducedMotion.matches || !entry.isIntersecting);
      }
    },{root:document.getElementById('gallery-panel'),rootMargin:'400px'});
    function renderGallery() {
      lazyObserver.disconnect();
      const theme=document.getElementById('theme-filter').value;
      const screens=state.screens.filter(screen=>theme==='all' || screen.theme===theme);
      gallery.replaceChildren();
      document.getElementById('gallery-count').textContent=`${screens.length} 张 SVG · 每张均可打开原图查看；题数与内容为本次提案。`;
      for(const [index,screen] of screens.entries()) {
        const figure=document.createElement('figure');
        const caption=document.createElement('figcaption');
        const label=document.createElement('span');
        const screenId=String(screen.number ?? screen.id ?? index+1).padStart(2,'0');
        const title=String(screen.label ?? screen.title ?? 'SCREEN');
        label.textContent=`${screenId} / ${title.toUpperCase()}`;
        const tag=document.createElement('span');tag.className=`theme-tag ${screen.theme==='velvet'?'velvet':''}`;tag.textContent=themeName(screen.theme);
        caption.append(label,tag);
        const preview=document.createElement('div');preview.className='screen-preview';
        const object=document.createElement('object');object.type='image/svg+xml';object.dataset.src=encodeURI(String(screen.file));object.setAttribute('aria-label',`${label.textContent} / ${tag.textContent}`);
        object.addEventListener('load',()=>{const root=contentRoot(object);if(root){svgDocuments.add(root);motionFor(root,state.paused||reducedMotion.matches);}});
        preview.append(object);
        const note=document.createElement('p');note.className='screen-note';note.textContent=String(screen.note ?? '');
        const link=document.createElement('a');link.className='screen-link';link.href=encodeURI(String(screen.file));link.target='_blank';link.rel='noopener';link.textContent='Open SVG ↗';link.setAttribute('aria-label',`打开 ${title} ${tag.textContent} SVG 原图`);
        figure.append(caption,preview,note,link);gallery.append(figure);lazyObserver.observe(object);
      }
    }
    async function loadGallery() {
      if(state.manifestLoaded) return;
      try {
        const response=await fetch('manifest.json',{cache:'no-cache'});
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const manifest=await response.json();
        if(!Array.isArray(manifest.screens)) throw new Error('缺少 screens 清单');
        state.screens=manifest.screens.filter(screen=>screen && typeof screen.file==='string' && !/^(?:https?:|\/\/|data:|javascript:)/i.test(screen.file));
        state.manifestLoaded=true;renderGallery();
      } catch(error) {
        const message=document.getElementById('gallery-error');message.hidden=false;message.textContent='单屏清单暂未载入，请使用大画布或直接打开 SVG 原图。';
        document.getElementById('gallery-count').textContent='单屏清单暂不可用';
      }
    }
    document.getElementById('theme-filter').addEventListener('change',renderGallery);
    setScale('fit',false);applyMotion();
  </script>
</body>
</html>
