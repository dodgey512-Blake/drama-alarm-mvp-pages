      <g clip-path="url(#lamp-loop-right-leg-clip)"><use href="#lamp-loop-leg-shape"/></g>
    </g>
    <g data-motion-part="lamp-breathing-body">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0;0 3;0 0" keyTimes="0;.25;.5;.75;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1;.42 0 .58 1;.42 0 .58 1" dur="4s" repeatCount="indefinite"/>
      <g data-motion-part="lamp-left-hand">
        <animateTransform attributeName="transform" type="rotate" values="-14 81 116;14 81 116;-14 81 116" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="4s" repeatCount="indefinite"/>
        <g clip-path="url(#lamp-loop-left-arm-clip)"><use href="#lamp-loop-arm-shape"/></g>
      </g>
      <g data-motion-part="lamp-right-hand">
        <animateTransform attributeName="transform" type="rotate" values="14 168 115;-14 168 115;14 168 115" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="4s" repeatCount="indefinite"/>
        <g clip-path="url(#lamp-loop-right-arm-clip)"><use href="#lamp-loop-arm-shape"/></g>
      </g>
      <use href="#lamp-loop-torso-shape"/>
      <g data-motion-part="lamp-scan-head">
        <animateTransform attributeName="transform" type="rotate" values="-9 122 145;9 122 145;-9 122 145" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="4s" repeatCount="indefinite"/>
        <use href="#lamp-loop-head-shape"/>
      </g>
    </g>
  </g>
