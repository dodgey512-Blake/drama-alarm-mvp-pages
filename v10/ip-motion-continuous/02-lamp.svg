<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="lamp-loop-title lamp-loop-desc" data-cycle-seconds="4" data-character="lamp">
  <title id="lamp-loop-title">灯光精灵 · 四秒持续巡光</title>
  <desc id="lamp-loop-desc">沿用疯狂闹钟原灯光精灵造型。灯头和面部带着光束持续左右转动，双手交替摆动，双脚轻轻换重心；四秒无缝循环，没有停留等待段。系统减少动态偏好与手动播放由预览页统一控制。</desc>
  <defs>
    <linearGradient id="lamp-loop-mint" x1=".2" y1="0" x2=".9" y2="1">
      <stop stop-color="#d6f1de"/>
      <stop offset=".55" stop-color="#a6d2bd"/>
      <stop offset="1" stop-color="#6ca58f"/>
    </linearGradient>
    <radialGradient id="lamp-loop-lens" cx=".37" cy=".3" r=".8">
      <stop stop-color="#fff9e5"/>
      <stop offset=".66" stop-color="#f3e7bd"/>
      <stop offset="1" stop-color="#d6c891"/>
    </radialGradient>
    <clipPath id="lamp-loop-left-leg-clip"><rect x="60" y="158" width="66" height="64"/></clipPath>
    <clipPath id="lamp-loop-right-leg-clip"><rect x="126" y="158" width="61" height="64"/></clipPath>
    <clipPath id="lamp-loop-left-arm-clip"><rect x="35" y="100" width="88" height="65"/></clipPath>
    <clipPath id="lamp-loop-right-arm-clip"><rect x="123" y="100" width="87" height="65"/></clipPath>
    <path id="lamp-loop-leg-shape" d="M97 165c-3 18-9 32-15 40-3 6 3 10 10 9 10-1 16-9 18-17l6-28m22-1 7 32c2 8 10 15 19 14 7-1 9-5 5-10-8-10-13-24-14-39" fill="#6f9788"/>
    <path id="lamp-loop-arm-shape" d="M81 116c-24 9-29 28-23 35 6 6 14 1 18-4m92-32c18 3 28 19 25 30-3 8-12 7-17 2" fill="none" stroke="#8ab7a1" stroke-width="13" stroke-linecap="round"/>
    <g id="lamp-loop-torso-shape">
      <path d="M82 66q41-23 78 0l10 79c1 16-21 32-44 33-25 1-47-12-47-28Z" fill="url(#lamp-loop-mint)"/>
      <path d="M91 157c18 12 43 14 62 1" fill="none" stroke="#588c76" stroke-width="3" stroke-linecap="round" opacity=".45"/>
      <path d="M114 157q8 5 16 0l-3-13h-10Z" fill="#f2dfb0"/>
      <circle cx="122" cy="150" r="3" fill="#b49352"/>
    </g>
    <g id="lamp-loop-head-shape">
      <path d="M161 75 226 48q10 59 0 113l-65-30Z" fill="#f4e9c8" opacity=".3"/>
      <path d="M80 72c-4-5-3-14 3-19 14-13 55-17 75-3 8 5 11 14 6 20" fill="#7aab94"/>
      <path d="M100 50c-1-9 5-17 17-17 11 0 17 6 18 14" fill="none" stroke="#6c9b85" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="122" cy="97" rx="51" ry="53" fill="#8eb9a2"/>
      <ellipse cx="121" cy="94" rx="43" ry="45" fill="#e4edd9"/>
      <ellipse cx="121" cy="94" rx="37" ry="39" fill="url(#lamp-loop-lens)"/>
      <path d="M93 78c4-11 11-17 21-19" fill="none" stroke="#fffef3" stroke-width="5" stroke-linecap="round" opacity=".8"/>
      <ellipse cx="108" cy="94" rx="3.7" ry="5.7" fill="#385b4c"/>
      <ellipse cx="134" cy="94" rx="3.7" ry="5.7" fill="#385b4c"/>
      <path d="M115 111c4 4 9 4 13 0" fill="none" stroke="#55745c" stroke-width="2.8" stroke-linecap="round"/>
      <ellipse cx="96" cy="107" rx="6" ry="3.5" fill="#cead8a" opacity=".35"/>
      <ellipse cx="145" cy="107" rx="6" ry="3.5" fill="#cead8a" opacity=".35"/>
      <path d="m191 51 4-10m7 18 10-4" stroke="#d1b66e" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="lamp-loop-static-character">
      <ellipse cx="123" cy="218" rx="60" ry="8" fill="#22352e" opacity=".09"/>
      <use href="#lamp-loop-leg-shape"/>
      <use href="#lamp-loop-arm-shape"/>
      <use href="#lamp-loop-torso-shape"/>
      <use href="#lamp-loop-head-shape"/>
    </g>
  </defs>
  <g class="lamp-loop-live" transform="translate(40 40)">
    <ellipse cx="123" cy="218" rx="60" ry="8" fill="#22352e" opacity=".09" data-motion-part="lamp-ground-shadow"/>
    <g data-motion-part="lamp-left-foot">
      <animateTransform attributeName="transform" type="rotate" values="-5 106 168;5 106 168;-5 106 168" keyTimes="0;.5;1" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1" dur="4s" repeatCount="indefinite"/>
