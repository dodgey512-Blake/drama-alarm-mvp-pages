  <style data-source="styles.css">:root {

}

* { box-sizing: border-box; }

}

html { min-height: 100%; background: #f2e8df; }

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  color: var(--plum);
  background:
    radial-gradient(circle at 10% 15%, rgba(231, 90, 124, 0.12), transparent 30%),

  font-family: "Avenir Next", "Helvetica Neue", sans-serif;

}

button, input { font: inherit; }

  outline: 3px solid rgba(231, 90, 124, 0.36);
  outline-offset: 3px;
}

.demo-shell { min-height: 100vh; padding: 18px clamp(14px, 3vw, 42px) 28px; }

.demo-topbar {
  width: min(1180px, 100%);
  min-height: 48px;

.demo-topbar__actions { display: flex; align-items: center; gap: 10px; }

.icon-button, .scene-button {

.demo-stage {

#app, .screen { width: 100%; height: 100%; }
.screen {
  position: relative;
  overflow: hidden;
  background: var(--cream);
  animation: screen-in 420ms var(--ease) both;
}
.screen::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 20;
  pointer-events: none;
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px rgba(69, 43, 61, 0.05);

.ambient {
  position: absolute;

}

.status-bar {

  padding: 25px 42px 0;
  position: relative;
  z-index: 3;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;

  font-weight: 600;
}
.battery { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; opacity: 0.42; position: relative; }

.battery::after { content: ""; position: absolute; width: 2px; height: 5px; right: -4px; top: 2px; border-radius: 1px; background: currentColor; opacity: 0.7; }

.screen-body { position: relative; z-index: 2; height: calc(100% - 70px); padding: 18px 42px 30px; display: flex; flex-direction: column; }
.screen-body--center { align-items: center; text-align: center; }

.spark { width: 16px; height: 16px; background: var(--gold); clip-path: polygon(50% 0, 60% 39%, 100% 50%, 60% 61%, 50% 100%, 40% 61%, 0 50%, 40% 39%); animation: sparkle 2.4s ease-in-out infinite; }
.spark--small { width: 13px; height: 13px; }

@keyframes sparkle { 50% { opacity: 0.55; transform: rotate(5deg) scale(0.92); } }

.primary, .secondary, .text-button {
  width: 100%;
  min-height: 58px;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 180ms var(--ease), box-shadow 180ms var(--ease), background 180ms var(--ease);
}

.secondary { border: 1px solid rgba(69, 43, 61, 0.2); background: transparent; color: var(--plum); font-size: 15px; }
.screen--dark .secondary { border-color: rgba(246, 231, 236, 0.3); color: #f6e7ec; }
.text-button { min-height: 44px; border: 0; background: transparent; color: var(--muted); font-size: 12px; }
.button-stack { width: 100%; margin-top: auto; display: grid; gap: 12px; }

.brand-stage { width: 100%; height: 330px; margin-top: 18px; position: relative; display: grid; place-items: center; }
.curtain-mini { position: absolute; inset: 0; overflow: hidden; }
.curtain-mini::before, .curtain-mini::after { content: ""; position: absolute; top: 15px; bottom: 0; width: 92px; background: linear-gradient(90deg, #e75a7c, #f28aa2); }
.curtain-mini::before { left: 0; clip-path: polygon(0 0, 100% 10%, 76% 100%, 0 84%); }
.curtain-mini::after { right: 0; clip-path: polygon(0 10%, 100% 0, 100% 84%, 24% 100%); }
.curtain-valance { position: absolute; left: 0; right: 0; top: 15px; height: 58px; background: var(--rose); clip-path: polygon(0 0,100% 0,100% 55%,94% 80%,88% 55%,82% 80%,76% 55%,70% 80%,64% 55%,58% 80%,52% 55%,46% 80%,40% 55%,34% 80%,28% 55%,22% 80%,16% 55%,10% 80%,4% 55%,0 80%); }
.spotlight { position: absolute; top: 48px; width: 170px; height: 260px; background: linear-gradient(to bottom, rgba(240,174,74,.28), rgba(240,174,74,0)); clip-path: polygon(45% 0,55% 0,100% 100%,0 100%); animation: breathe 4s ease-in-out infinite; }

.permission-mark, .gentle-mark, .wake-mark {

.permission-list { width: 100%; margin: 28px 0 0; padding: 20px 24px; border-radius: 26px; background: var(--paper); box-shadow: var(--shadow); display: grid; gap: 18px; text-align: left; }

.page-dots { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }

.math-progress { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 12px; }

.math-equation { margin: auto 0 18px; font-size: clamp(62px, 18vw, 78px); line-height: 1; font-weight: 500; letter-spacing: -0.05em; }

.alarm-card { padding: 22px 24px; border-radius: 27px; background: var(--paper); box-shadow: var(--shadow); }

.wrong-panel { margin-top: 46px; text-align: center; }
.loading-dots { margin: 28px 0; display: flex; justify-content: center; gap: 8px; }
.loading-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--lilac); animation: dot-wave 1.2s ease-in-out infinite; }
.loading-dots i:nth-child(2) { animation-delay: .2s; }
.loading-dots i:nth-child(3) { animation-delay: .4s; }
@keyframes dot-wave { 50% { opacity: .3; transform: translateY(-5px); } }

.bravo-burst { width: 210px; height: 210px; margin-top: 14px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, rgba(240,174,74,.32), rgba(240,174,74,0) 66%); position: relative; }
.bravo-burst::before, .bravo-burst::after { content: ""; position: absolute; width: 1px; height: 178px; background: linear-gradient(var(--gold), transparent); animation: slow-spin 40s linear infinite; }
.bravo-burst::after { transform: rotate(90deg); }
@keyframes slow-spin { to { transform: rotate(360deg); } }
.bravo-burst strong { font-size: 62px; font-weight: 500; letter-spacing: -0.05em; }
.stats { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 8px; }
.stat { padding: 14px 6px; text-align: center; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat strong { display: block; font-size: 24px; font-weight: 500; }
.stat small { color: var(--muted); font-size: 10px; }

.gentle-mark::before { content: ""; width: 54px; height: 54px; border: 3px solid rgba(165,136,212,.55); border-radius: 50%; }
.gentle-mark::after { content: "⌣"; position: absolute; font-size: 40px; color: var(--plum); transform: translateY(5px); }
.difficulty-shift { width: 100%; margin-top: 26px; padding: 22px; border-radius: 27px; background: var(--paper); box-shadow: var(--shadow); }
.difficulty-shift div { display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 13px; }
.difficulty-shift span { padding: 7px 16px; border-radius: 999px; background: var(--lilac-soft); color: var(--lilac); font-size: 11px; }
.difficulty-shift span:last-child { background: var(--rose-soft); color: var(--rose); }

.hold-ring { --hold-progress: 0deg; width: 190px; height: 190px; margin: 46px 0 30px; padding: 8px; border: 0; border-radius: 50%; background: conic-gradient(var(--gold) var(--hold-progress), rgba(255,255,255,.12) 0); cursor: pointer; position: relative; touch-action: none; }
.hold-ring::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--plum-2); }
.hold-ring__core { position: absolute; inset: 53px; border-radius: 50%; background: var(--rose); display: grid; place-items: center; align-content: center; color: white; animation: breathe 2.2s ease-in-out infinite; }
.hold-ring__core strong { font-size: 17px; }
.hold-ring__core small { margin-top: 3px; opacity: .78; }
.stand-hold { width: 100%; height: 60px; margin: 0; padding: 0; border-radius: 999px; background: var(--cream); }
.stand-hold::before { display: none; }
.stand-hold span { position: relative; z-index: 2; color: var(--plum); font-weight: 600; }
.stop-code-label { margin: 26px 0 9px; color: #c9a8b6; font-size: 10px; font-weight: 700; letter-spacing: .16em; }
.stop-code { width: 154px; height: 52px; border: 1px solid rgba(255,255,255,.22); border-radius: 18px; background: rgba(255,255,255,.08); color: white; font: 700 24px/1 var(--font-display); letter-spacing: .28em; text-align: center; text-transform: uppercase; outline: none; }
.stop-code:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(240,174,74,.12); }

.wake-mark::before { content: ""; width: 62px; height: 62px; border: 2px solid rgba(240,174,74,.45); border-radius: 50%; }
.wake-mark .spark { position: absolute; width: 58px; height: 58px; }
.timeout-card { width: 100%; margin-top: 28px; padding: 20px 22px; border-radius: 25px; background: var(--paper); box-shadow: var(--shadow); text-align: left; }
.timeout-card strong { display: block; margin-top: 8px; font-size: 14px; }
.timeout-card small { display: block; margin-top: 4px; color: var(--muted); }

.off-mark { width: 136px; height: 136px; margin-top: 26px; border-radius: 50%; background: var(--paper); box-shadow: var(--shadow); position: relative; }
.off-mark::before { content: ""; position: absolute; left: 34px; right: 34px; top: 61px; height: 32px; border: 4px solid var(--muted); border-color: var(--muted) transparent transparent; border-radius: 50%; opacity: .8; }
.off-mark::after { content: ""; position: absolute; left: 25px; right: 25px; top: 66px; height: 6px; border-radius: 3px; background: var(--error); transform: rotate(45deg); }
.warning-strip { width: 100%; min-height: 58px; margin-top: 28px; padding: 0 18px; border-radius: 18px; background: var(--rose-soft); color: var(--error); display: flex; align-items: center; gap: 12px; font-size: 14px; }
.warning-strip i { width: 24px; height: 24px; border-radius: 50%; background: var(--error); color: white; display: grid; place-items: center; font-style: normal; }

.system-time { margin-top: 38px; text-align: center; }
.system-time small { opacity: .76; }
.system-time strong { display: block; margin-top: 12px; font-size: 86px; font-weight: 300; letter-spacing: -0.06em; }
.system-card { margin: 60px 24px 0; padding: 24px 20px; border: 1px solid rgba(255,255,255,.24); border-radius: 34px; background: rgba(255,255,255,.15); backdrop-filter: blur(18px); box-shadow: 0 18px 40px rgba(20,10,20,.2); }
.system-app { display: flex; align-items: center; gap: 13px; }
.system-icon { width: 46px; height: 46px; border-radius: 13px; background: var(--cream); position: relative; }
.system-icon::before { content: ""; position: absolute; left: 10px; right: 10px; bottom: 11px; height: 16px; border: 3px solid var(--rose); border-color: var(--rose) transparent transparent; border-radius: 50%; }
.system-actions { display: grid; grid-template-columns: 1fr 1.15fr; gap: 10px; margin-top: 24px; }
.system-actions button { min-height: 54px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.12); color: white; cursor: pointer; }
.system-actions button:last-child { border: 0; background: var(--cream); color: var(--plum); font-weight: 600; }

.settings-group { margin-top: 18px; }
.settings-group > span { display: block; margin: 0 0 8px 2px; color: var(--rose); font-size: 11px; letter-spacing: .2em; }
.settings-card { padding: 0 18px; border-radius: 24px; background: var(--paper); box-shadow: var(--shadow); }
.settings-row { min-height: 52px; border-bottom: 1px solid rgba(69,43,61,.07); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.settings-row:last-child { border-bottom: 0; }
.settings-row button:not(.toggle) { min-height: 44px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }

.sound-card { min-height: 78px; margin-top: 12px; padding: 14px 16px; border-radius: 24px; background: var(--paper); box-shadow: var(--shadow); display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 12px; }
.sound-card.is-active { border: 1px solid rgba(231,90,124,.55); }
.sound-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--rose-soft); color: var(--rose); display: grid; place-items: center; font-size: 12px; }
.sound-card:nth-of-type(2) .sound-icon, .sound-card:nth-of-type(4) .sound-icon { background: var(--lilac-soft); color: var(--lilac); }
.sound-card h3 { margin: 0; font-size: 15px; font-weight: 600; }
.sound-card p { margin: 3px 0 0; color: var(--muted); font-size: 10.5px; }
.sound-action { min-width: 54px; min-height: 40px; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px; background: transparent; cursor: pointer; font-size: 11px; }

.pass-list { width: 100%; margin: 30px 0; display: grid; gap: 16px; text-align: left; }
.pass-list p { margin: 0; display: flex; align-items: center; gap: 12px; font-size: 14px; }
.pass-list i { width: 25px; height: 25px; border-radius: 50%; background: var(--rose-soft); color: var(--rose); display: grid; place-items: center; font-style: normal; }
.plan { width: 100%; min-height: 74px; margin-top: 10px; padding: 0 18px; border: 1px solid var(--line); border-radius: 24px; background: var(--paper); display: flex; align-items: center; justify-content: space-between; cursor: pointer; text-align: left; }
.plan.is-on { border: 2px solid var(--rose); }
.plan strong { display: block; }
.plan small { color: var(--muted); }

.streak-number { margin-top: 22px; font-size: 102px; line-height: 1; font-weight: 500; letter-spacing: -0.06em; }
.week { width: 100%; margin-top: 26px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.week div { text-align: center; color: var(--muted); font-size: 10px; }
.week i { width: 30px; height: 30px; margin: 0 auto 6px; display: block; border: 1px solid var(--line); border-radius: 50%; }
.week .done i { border-color: var(--rose); background: var(--rose); }
.week .today i { border: 2px solid var(--rose); box-shadow: inset 0 0 0 8px var(--cream); background: var(--rose); }
.achievements { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
.achievement { min-height: 74px; border: 0; border-radius: 22px; background: var(--paper); color: var(--plum); box-shadow: var(--shadow); cursor: pointer; font-size: 9px; }
.achievement b { display: block; margin-bottom: 7px; color: var(--gold); font-size: 23px; font-weight: 500; }

.rare-screen { background: var(--plum-2); }
.rare-star { margin: 80px 0 42px; position: relative; }
.rare-star::before { content: ""; position: absolute; inset: -26px; border: 1px solid rgba(240,174,74,.5); border-radius: 50%; animation: ring-out 2.8s ease-out infinite; }
.rise-arrow { margin: 26px 0 16px; color: var(--gold); font-size: 54px; line-height: 1; animation: rise 1.8s ease-in-out infinite; }
@keyframes rise { 50% { transform: translateY(-7px); } }

.prototype-note { margin: 10px 0 0; color: rgba(69,43,61,.54); font-size: 10px; text-align: center; }

.scene-panel {
  max-height: min(844px, calc(100vh - 112px));
  overflow: hidden;
  padding: 26px;
  border: 1px solid var(--line);
  border-radius: 32px;
  background: rgba(255,253,249,.74);
  backdrop-filter: blur(20px);
  box-shadow: 0 22px 60px rgba(69,43,61,.1);
  display: flex;
  flex-direction: column;
}
.scene-panel__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
.scene-panel h2 { margin: 6px 0 0; font-size: 28px; font-weight: 500; letter-spacing: -0.04em; }
.scene-panel__close { display: none; }
#scene-list { margin-top: 20px; overflow: auto; padding-right: 6px; }
.scene-group + .scene-group { margin-top: 18px; }
.scene-group h3 { margin: 0 0 8px; color: var(--muted); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
.scene-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 7px; }
.scene-jump { min-height: 48px; padding: 8px 10px; border: 1px solid transparent; border-radius: 15px; background: rgba(69,43,61,.035); display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; }
.scene-jump b { color: var(--rose); font-size: 11px; }
.scene-jump span { overflow: hidden; font-size: 11px; white-space: nowrap; text-overflow: ellipsis; }
.scene-jump:hover { background: var(--paper); border-color: var(--line); }
.scene-jump.is-active { background: var(--plum); color: var(--cream); }
.scene-panel__foot { margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--line); display: flex; align-items: flex-start; gap: 10px; color: var(--muted); font-size: 11px; line-height: 1.5; }
.scene-panel__foot p { margin: 0; }
.status-dot { width: 8px; height: 8px; margin-top: 4px; flex: 0 0 8px; border-radius: 50%; background: #72a884; }

.toast { position: fixed; left: 50%; bottom: 28px; z-index: 80; max-width: min(420px, calc(100vw - 32px)); padding: 12px 18px; border-radius: 999px; background: var(--plum); color: var(--cream); box-shadow: 0 14px 34px rgba(69,43,61,.24); font-size: 13px; opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity 220ms ease, transform 220ms var(--ease); }
.toast.is-visible { opacity: 1; transform: translate(-50%,0); }

.modal-layer { position: fixed; inset: 0; z-index: 90; padding: 20px; background: rgba(42,24,40,.46); backdrop-filter: blur(10px); display: grid; place-items: center; }
.modal-layer[hidden] { display: none; }
.modal { width: min(480px,100%); max-height: min(720px, calc(100vh - 40px)); overflow: auto; padding: 28px; border-radius: 30px; background: var(--paper); box-shadow: 0 30px 80px rgba(42,24,40,.28); }
.modal h2 { margin: 0; font-size: 28px; font-weight: 500; }
.modal p { color: var(--muted); font-size: 13px; line-height: 1.65; }
.modal ol { margin: 18px 0; padding-left: 20px; color: var(--plum); font-size: 13px; line-height: 1.8; }
.modal .primary { margin-top: 12px; }

@media (max-width: 820px) {
  .demo-shell { padding: 8px 0 0; }
  .demo-topbar { padding: 0 14px; margin-bottom: 8px; }
  .demo-chip { display: none; }
  .demo-stage { display: block; }
  .phone { width: min(390px,100vw); height: calc(100vh - 64px); min-height: 580px; border-width: 0; border-radius: 34px 34px 0 0; }
  .prototype-note { display: none; }
  .scene-panel { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 70; max-height: min(76vh,720px); transform: translateY(calc(100% + 24px)); transition: transform 320ms var(--ease); }
  .scene-panel.is-open { transform: translateY(0); }
  .scene-panel__close { display: inline-grid; place-items: center; }
}

@media (max-height: 740px) and (min-width: 821px) {
  .phone, .scene-panel { height: calc(100vh - 112px); min-height: 590px; }
  .screen-body { padding-top: 8px; padding-bottom: 22px; }
  .showtime-rings { width: 265px; height: 265px; margin-top: 15px; }
  .showtime-time { font-size: 70px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: 1ms !important; }
}

/* Product build v2 */
.qa-only { display: none !important; }
.qa-mode .demo-topbar { display: flex !important; }
.qa-mode .scene-panel { display: flex !important; }
.qa-mode .prototype-note { display: block !important; }

.demo-shell { display: grid; align-content: center; }
.demo-stage { grid-template-columns: minmax(320px, 430px); place-content: center; }
.qa-mode .demo-shell { display: block; }
.qa-mode .demo-stage { grid-template-columns: minmax(390px, 460px) minmax(320px, 1fr); place-content: initial; }
.phone { height: min(874px, calc(100dvh - 48px)); min-height: 660px; }
.qa-mode .phone { height: min(844px, calc(100dvh - 112px)); }

.launch-stage { position: absolute; inset: 0; z-index: 60; overflow: hidden; display: grid; place-items: center; background: var(--plum-3); color: var(--cream); opacity: 1; visibility: visible; transition: opacity 420ms var(--ease), visibility 420ms; }
.is-launched .launch-stage { opacity: 0; visibility: hidden; pointer-events: none; }
.launch-curtain { position: absolute; inset-block: 0; width: 54%; background: linear-gradient(90deg, #bd1f49, var(--rose) 68%, #c73158); transition: transform 900ms var(--ease-ios) 180ms; }
.launch-curtain--left { left: 0; clip-path: polygon(0 0,100% 0,84% 100%,0 100%); }
.launch-curtain--right { right: 0; clip-path: polygon(0 0,100% 0,100% 100%,16% 100%); }
.is-launched .launch-curtain--left { transform: translateX(-82%); }
.is-launched .launch-curtain--right { transform: translateX(82%); }
.launch-mark { position: relative; z-index: 2; display: grid; place-items: center; gap: 10px; transition: opacity 280ms ease 580ms, transform 380ms var(--ease) 520ms; }
.launch-mark strong { font-size: 23px; font-weight: 600; letter-spacing: -.03em; }
.launch-mark span { color: #c9a8b6; font-size: 11px; letter-spacing: .08em; }
.is-launched .launch-mark { opacity: 0; transform: translateY(-8px) scale(.96); }

.screen-body--scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.screen-body--scroll::-webkit-scrollbar { display: none; }
.full-width { width: 100%; }
.compact-button { width: auto; min-width: 44px; padding: 0; }
.save-link { color: var(--rose); font-weight: 600; }
.back-chevron { font-size: 24px; }
.privacy-line { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.5; text-align: center; }
.section-label { display: block; margin: 18px 0 8px 2px; }
.button-note { margin: 0; }

.welcome-body { padding-top: 8px; }
.welcome-body .brand-stage { height: 285px; margin-top: 10px; }
.stage-floor { position: absolute; bottom: 18px; width: 168px; height: 28px; border-radius: 50%; background: radial-gradient(ellipse, rgba(69,43,61,.16), transparent 68%); }
.arrival-card { width: 100%; min-height: 68px; margin-top: 20px; padding: 14px 16px; border: 1px solid rgba(69,43,61,.07); border-radius: 22px; background: rgba(255,253,249,.74); display: flex; align-items: center; gap: 13px; text-align: left; box-shadow: 0 12px 34px rgba(69,43,61,.07); }
.arrival-card__pulse { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%; background: var(--rose-soft); position: relative; }
.arrival-card__pulse::before, .arrival-card__pulse::after { content: ""; position: absolute; inset: 10px; border: 1.5px solid var(--rose); border-radius: 50%; }
.arrival-card__pulse::after { inset: 15px; background: var(--rose); }
.arrival-card strong, .arrival-card span { display: block; }
.arrival-card strong { font-size: 12px; }
.arrival-card span { margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.45; }

.permission-mark--live { margin-top: 28px; }
.permission-mark--live i { position: absolute; width: 8px; height: 8px; top: 38px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 0 rgba(240,174,74,.34); animation: access-pulse 2.2s ease-out infinite; }
@keyframes access-pulse { 50% { box-shadow: 0 0 0 15px rgba(240,174,74,0); } }
.permission-title { margin-top: 24px; }
.permission-list p { align-items: flex-start; }
.permission-list p > i { margin-top: 6px; flex: 0 0 8px; }
.permission-list span, .permission-list strong, .permission-list small { display: block; }
.permission-list small { margin-top: 3px; color: var(--muted); font-size: 10px; }

.act-progress { width: 168px; margin: 18px auto 0; display: grid; grid-template-columns: 12px 1fr 12px 1fr 12px; align-items: center; gap: 7px; }
.act-progress i { width: 10px; height: 10px; border: 1.5px solid rgba(69,43,61,.22); border-radius: 50%; background: var(--cream); }
.act-progress i.is-active { border-color: var(--rose); box-shadow: inset 0 0 0 2px var(--cream); background: var(--rose); }
.act-progress i.is-done { border-color: var(--rose); background: var(--rose); }
.act-progress i:nth-of-type(2).is-active, .act-progress i:nth-of-type(2).is-done { border-color: var(--lilac); background: var(--lilac); }
.act-progress i:nth-of-type(3).is-active, .act-progress i:nth-of-type(3).is-done { border-color: var(--gold); background: var(--gold); }
.act-progress span { height: 1px; background: rgba(69,43,61,.13); }

.sound-rehearsal { padding-top: 5px; }
.sound-rehearsal .screen-head h1 { margin-top: 3px; font-size: 20px; }
.sound-level { min-height: 28px; padding: 7px 10px; border-radius: 999px; background: rgba(69,43,61,.06); color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .08em; }
.sound-hero { width: 100%; min-height: 225px; margin-top: 18px; padding: 22px 22px 18px; border-radius: 32px; background: var(--paper); box-shadow: var(--shadow); display: grid; justify-items: center; position: relative; overflow: hidden; }
.sound-hero__halo { position: absolute; width: 210px; height: 150px; top: -38px; border-radius: 50%; filter: blur(28px); opacity: .28; }
.sound-hero--rose .sound-hero__halo { background: var(--rose); }
.sound-hero--lilac .sound-hero__halo { background: var(--lilac); }
.sound-hero--gold .sound-hero__halo { background: var(--gold); }
.sound-hero__disc { width: 92px; height: 92px; margin-bottom: 13px; border-radius: 50%; background: var(--plum); display: grid; place-items: center; box-shadow: 0 14px 28px rgba(69,43,61,.19); position: relative; }
.sound-hero h2 { margin: 4px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -.04em; }
.sound-hero p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
.sound-wave { height: 34px; display: flex; align-items: center; justify-content: center; gap: 3px; }
.sound-wave i { width: 2px; height: calc(6px + var(--bar) * 2px); border-radius: 999px; background: currentColor; opacity: .84; }
.sound-hero .sound-wave { color: var(--cream); }
.sound-wave.is-playing i { animation: sound-bar 720ms ease-in-out infinite alternate; animation-delay: calc(var(--bar) * -54ms); }
@keyframes sound-bar { 0% { transform: scaleY(.35); opacity: .42; } 100% { transform: scaleY(1.15); opacity: 1; } }
.sound-choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.sound-choice { min-height: 43px; padding: 0 10px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,253,249,.62); display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left; font-size: 10px; }
.sound-choice > i { width: 10px; height: 10px; flex: 0 0 10px; border: 1px solid currentColor; border-radius: 50%; }
.sound-choice b { margin-left: auto; color: var(--rose); font-size: 7px; letter-spacing: .1em; }
.sound-choice.is-selected { border-color: rgba(69,43,61,.42); background: var(--paper); box-shadow: 0 5px 12px rgba(69,43,61,.06); }
.sound-choice.is-selected > i { border: 3px solid var(--paper); background: var(--rose); box-shadow: 0 0 0 1px var(--rose); }
.sound-choice--lilac.is-selected > i { background: var(--lilac); box-shadow: 0 0 0 1px var(--lilac); }
.sound-choice--gold.is-selected > i { background: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.volume-control { margin-top: 14px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 7px 12px; color: var(--plum); font-size: 11px; }
.volume-control output { color: var(--rose); font-weight: 700; }
.volume-control input { grid-column: 1 / -1; }
.sound-setup-actions { margin-top: 15px; grid-template-columns: 1fr; gap: 8px; }
.sound-setup-actions .primary, .sound-setup-actions .secondary { min-height: 50px; }
.rehearsal-intro { margin-top: 40px; }
.finale-label { display: block; margin-top: 36px; color: var(--lilac); text-align: center; }
.rehearsal-question { margin-top: 16px; }
.rehearsal-copy { margin: 0 0 16px; text-align: center; }

input[type="range"] { width: 100%; height: 24px; padding: 0; appearance: none; background: transparent; cursor: pointer; }

input[type="range"]::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -8.5px; appearance: none; border: 4px solid var(--paper); border-radius: 50%; background: var(--plum); box-shadow: 0 3px 10px rgba(69,43,61,.22); }

.bravo-burst--compact { width: 180px; height: 180px; }

.rehearsal-summary p { min-height: 48px; margin: 0; border-bottom: 1px solid rgba(69,43,61,.07); display: grid; grid-template-columns: 9px 1fr auto; align-items: center; gap: 10px; text-align: left; font-size: 11px; }
.rehearsal-summary p:last-child { border-bottom: 0; }

.home-body { padding-top: 8px; }

.alarm-list::-webkit-scrollbar { display: none; }
.alarm-card { position: relative; transition: opacity 200ms ease, transform 200ms var(--ease); }

.tag--gold { background: rgba(240,174,74,.16); color: #b87818; }
.empty-alarm { margin-top: 18px; padding: 30px 24px 24px; border: 1px dashed rgba(69,43,61,.15); border-radius: 30px; background: rgba(255,253,249,.58); display: grid; justify-items: center; text-align: center; }
.empty-alarm__bell { width: 72px; height: 72px; margin-bottom: 18px; border-radius: 50%; background: var(--rose-soft); position: relative; }
.empty-alarm__bell::before { content: ""; position: absolute; left: 19px; right: 19px; top: 25px; height: 20px; border: 3px solid var(--rose); border-color: var(--rose) transparent transparent; border-radius: 50%; }
.empty-alarm strong { font-size: 18px; }
.empty-alarm p { margin: 7px 0 20px; color: var(--muted); font-size: 11px; line-height: 1.5; }
.empty-alarm .secondary { min-height: 50px; }
.floating-add { position: relative; flex: 0 0 64px; }
.floating-add span::before, .floating-add span::after { content: ""; position: absolute; left: 21px; right: 21px; top: 31px; height: 2px; border-radius: 2px; background: var(--cream); }
.floating-add span::after { transform: rotate(90deg); }
.bottom-nav { flex: 0 0 58px; }
.bottom-nav button { display: grid; place-items: center; align-content: center; gap: 4px; }
.bottom-nav button span { display: block; }
.nav-mark { width: 16px; height: 13px; display: block; position: relative; opacity: .7; }
.nav-mark--home { border: 1.5px solid currentColor; border-top: 0; border-radius: 2px; }
.nav-mark--home::before { content: ""; position: absolute; width: 10px; height: 10px; left: 1.5px; top: -5px; border-left: 1.5px solid currentColor; border-top: 1.5px solid currentColor; transform: rotate(45deg); }
.nav-mark--run { border: 1.5px solid currentColor; border-radius: 50%; }
.nav-mark--run::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: currentColor; }
.nav-mark--settings { border: 1.5px solid currentColor; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--cream); background: currentColor; }

.editor-body { padding-top: 0; padding-bottom: 34px; }
.sticky-head { min-height: 50px; flex: 0 0 auto; }
.alarm-label-field { display: grid; gap: 7px; margin-top: 6px; }
.alarm-label-field input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,253,249,.72); color: var(--plum); outline: none; }
.alarm-label-field input:focus { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(231,90,124,.1); }
.editor-time { margin: 10px 0 12px; font-size: 58px; }
.form-row--button { width: 100%; padding: 0; border: 0; background: transparent; color: inherit; cursor: pointer; text-align: left; }
.form-row--button > span { display: grid; gap: 3px; }
.form-row--button strong { color: var(--rose); font-size: 11px; }
.volume-row { min-height: 80px; display: grid; grid-template-columns: 1fr auto; align-content: center; }
.volume-row span, .volume-row b, .volume-row small { display: block; }
.volume-row b { font-size: 14px; font-weight: 500; }
.volume-row input { grid-column: 1 / -1; }
.volume-row output { color: var(--rose); font-size: 11px; font-weight: 700; }
.form-error { margin: 12px 4px 0; color: var(--error); font-size: 12px; }
.editor-actions { margin-top: 18px; display: grid; gap: 6px; }
.text-button--danger { color: var(--error); }

.ready-spark { width: 48px; height: 48px; margin-top: 8px; }
.ready-eyebrow { margin-top: 18px; }
.ready-time { display: flex; align-items: flex-end; gap: 8px; }
.ready-time small { margin-bottom: 12px; color: var(--muted); font-size: 16px; letter-spacing: 0; }
.ready-check { margin-top: 22px; }
.ready-check p { display: grid; grid-template-columns: 18px 1fr auto; }
.ready-check strong { color: var(--muted); font-size: 10px; }

.ringing-state--hero { color: var(--rose); }
.ringing-state--lilac { color: var(--lilac); }
.showtime-rings small { position: absolute; bottom: 32px; color: #c9a8b6; font-size: 10px; letter-spacing: .08em; }
.curtain-caption { position: absolute; bottom: 48px; color: #c9a8b6; }
.emergency-link { position: absolute; right: 32px; top: 78px; width: auto; }
.wrong-copy { margin: 0 0 24px; }
.riddle-copy { margin: 0 0 16px; text-align: center; }
.riddle-question--wrong { margin-top: 18px; }
.shift-label { background: none; padding: 0; }
.gentle-mark--v2 { margin-top: 34px; }
.safety-title { margin-top: 28px; max-width: 290px; }
.emergency-availability { margin-top: 0; }
.emergency-quote { color: #e9c6d2; text-align: center; line-height: 1.7; }
.emergency-rule { margin: 0; color: #8c6e7c; font-size: 10px; text-align: center; }
.wake-mark--v2 { margin-top: 40px; }
.wake-title { margin-top: 34px; }
.wake-timeout { margin-top: 28px; }
.permission-off-title { margin-top: 28px; }

.settings-head h1 { font-size: 28px; }
.inline-setting { display: flex; align-items: center; gap: 8px; }
.gold-link { color: #b87818 !important; }
.danger-link { color: var(--error) !important; }

.sound-booth { padding-top: 0; padding-bottom: 28px; }
.sound-head { min-height: 52px; }
.sound-list { display: grid; gap: 10px; margin: 20px 0 16px; }
.sound-card { min-height: 94px; margin: 0; padding: 13px; grid-template-columns: 1fr auto; position: relative; }
.sound-card__main { min-width: 0; padding: 0; border: 0; background: transparent; display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 12px; color: inherit; cursor: pointer; text-align: left; }
.sound-card__main b, .sound-card__main small { display: block; }
.sound-card__main b { font-size: 14px; }
.sound-card__main small { margin-top: 4px; color: var(--muted); font-size: 9.5px; line-height: 1.4; }
.sound-card .sound-icon { width: 52px; height: 52px; color: var(--rose); }
.sound-card--lilac .sound-icon { background: var(--lilac-soft); color: var(--lilac); }
.sound-card--gold .sound-icon { background: rgba(240,174,74,.16); color: #b87818; }
.selected-badge { position: absolute; top: 8px; right: 12px; color: var(--rose); font-size: 7px; font-weight: 700; letter-spacing: .12em; }
.selected-sound-bar { position: sticky; bottom: -28px; margin: 8px -6px -28px; padding: 14px 6px 18px; background: linear-gradient(transparent,var(--cream) 18%); display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 12px; }
.selected-sound-bar span, .selected-sound-bar strong { display: block; }
.selected-sound-bar span { color: var(--muted); font-size: 8px; text-transform: uppercase; letter-spacing: .1em; }
.selected-sound-bar strong { margin-top: 3px; font-size: 11px; }
.selected-sound-bar .primary { min-height: 50px; font-size: 13px; }

.pass-close { position: absolute; right: 28px; top: 5px; width: 44px; font-size: 24px; }
.pass-spark { width: 72px; height: 72px; margin-top: 24px; }
.primary--danger { background: var(--error); color: white; }
.modal-actions { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions .primary, .modal-actions .secondary { min-height: 52px; font-size: 13px; }

.empty-run { margin: auto 0; display: grid; justify-items: center; }
.empty-run h1 { margin: 28px 0 0; max-width: 280px; font-size: 31px; line-height: 1.08; font-weight: 500; letter-spacing: -.04em; }
.empty-run p { max-width: 280px; color: var(--muted); font-size: 12px; line-height: 1.6; }
.muted-eyebrow { color: var(--muted); }
.run-stats { margin-top: 26px; border-radius: 24px; background: var(--paper); box-shadow: var(--shadow); }
.curtain-calls-label { align-self: flex-start; margin-top: 28px; }
.achievements { grid-template-columns: repeat(3,1fr); }
.achievement { opacity: .48; }
.achievement:first-child, .achievement.is-earned { opacity: 1; }
.run-nav { width: 100%; margin-top: auto; }
.rare-title { font-size: 38px; }
.rare-copy { color: #e9c6d2; line-height: 1.7; text-align: center; }

.system-card .system-app strong { display: block; font-size: 18px; }
.system-card > p { margin: 20px 0 0; line-height: 1.5; }
.system-note { margin: 18px 0 0 !important; text-align: center; opacity: .68; font-size: 10px; }
.system-caption { position: absolute; left: 0; right: 0; bottom: 48px; text-align: center; opacity: .62; font-size: 10px; }
.system-caption span { display: inline-block; margin-top: 8px; }

@media (max-width: 820px) {
  .demo-shell { min-height: 100dvh; padding: 0; display: block; }
  .demo-stage { display: block; }
  .phone { width: 100vw; height: 100dvh; min-height: 580px; border: 0; border-radius: 0; box-shadow: none; }
  .qa-mode .demo-shell { padding: 8px 0 0; }
  .qa-mode .phone { width: min(390px,100vw); height: calc(100dvh - 64px); border-radius: 34px 34px 0 0; }
  .qa-mode .scene-panel { display: flex !important; }
  .qa-mode .prototype-note { display: none !important; }
}

@media (max-height: 700px) {
  .welcome-body .brand-stage { height: 220px; }
  .arrival-card { display: none; }
  .sound-hero { min-height: 184px; padding-top: 14px; }
  .sound-hero__disc { width: 72px; height: 72px; }
  .permission-list { gap: 10px; margin-top: 18px; padding-block: 14px; }
  .pass-list { margin-block: 18px; gap: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  .launch-curtain { transition-delay: 0ms !important; }
  .sound-wave.is-playing i { animation: none !important; }
  .screen { animation: none !important; opacity: 1 !important; transform: none !important; }
}

.primary:disabled,
.secondary:disabled,
.text-button:disabled {
  cursor: not-allowed;
  opacity: .48;
  transform: none;
}

input[type="range"]:focus-visible {
  outline: 3px solid rgba(95, 45, 74, .22);
  outline-offset: 5px;
}

/* v3.0 readability, alignment, motion and sound-library system */
:root {
  --muted: #765f6b;
  --type-micro: 12px;
  --type-caption: 13px;
  --type-small: 14px;
  --type-body: 16px;
  --shadow-soft: 0 8px 24px rgba(69, 43, 61, .075);
  --shadow-raised: 0 18px 46px rgba(69, 43, 61, .13);
  --motion-fast: 160ms;
  --motion-base: 280ms;
  --motion-page: 360ms;
}

button, input { -webkit-tap-highlight-color: transparent; }

.screen { animation-duration: var(--motion-page); }
.screen-body {
  padding: 16px 30px 26px;
  animation: content-settle var(--motion-page) var(--ease) both;
}
.screen-body--flush { padding-left: 0; padding-right: 0; }
.status-bar { padding-inline: 30px; font-size: 15px; }

@keyframes content-settle {
  from { opacity: .01; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes tab-pop {
  0% { transform: translateY(2px) scale(.84); opacity: .5; }
  70% { transform: translateY(-1px) scale(1.07); opacity: 1; }
  100% { transform: none; opacity: 1; }
}
@keyframes card-arrive {
  from { opacity: .01; transform: translateY(7px) scale(.985); }
  to { opacity: 1; transform: none; }
}

.eyebrow {
  font-size: var(--type-micro);
  line-height: 1.35;
  font-weight: 700;
  letter-spacing: .18em;
}
.screen-title { font-size: clamp(31px, 8.2vw, 40px); line-height: 1.08; font-weight: 600; }
.screen-copy { font-size: var(--type-body); line-height: 1.55; }
.screen--dark .screen-copy { color: #ddc3ce; }
.privacy-line, .prototype-note { font-size: var(--type-micro); line-height: 1.5; }

.screen-head {
  min-height: 52px;
  align-items: center;
}
.screen-head h1 { font-size: 17px; line-height: 1.2; font-weight: 600; }
.screen-head > span:empty { width: 44px; flex: 0 0 44px; }
.compact-button {
  width: 44px;
  height: 44px;
  min-height: 44px;
  display: grid;
  place-items: center;
  line-height: 1;
}
.back-chevron { font-size: 30px; font-weight: 400; transform: translateY(-1px); }
.text-button { font-size: var(--type-small); font-weight: 500; }
.primary { font-size: 17px; }
.secondary { font-size: 16px; font-weight: 500; }
.primary, .secondary, .text-button { transition-duration: var(--motion-fast); }

.permission-list p, .check-card p, .pass-list p { font-size: 15px; line-height: 1.4; }
.permission-list small, .permission-list strong { font-size: var(--type-caption); line-height: 1.45; }
.arrival-card strong { font-size: var(--type-small); }
.arrival-card span { font-size: var(--type-caption); line-height: 1.45; }
.arrival-card { min-height: 76px; padding: 15px 17px; }

.ringing-state { font-size: var(--type-caption); font-weight: 600; }
.showtime-rings small { font-size: var(--type-caption); }
.math-equation { font-size: clamp(62px, 18vw, 78px); }
.math-equation--long { font-size: clamp(37px, 10vw, 48px); letter-spacing: -.045em; white-space: nowrap; }
.math-hint { font-size: var(--type-small); line-height: 1.45; }
.math-hint--wrong { font-size: 16px; }
.key { min-width: 58px; min-height: 58px; font-size: 25px; box-shadow: var(--shadow-soft); }
.key--plain { font-size: 20px; }
.keypad { gap: 11px 24px; }

.riddle-question { font-size: 23px; line-height: 1.38; font-weight: 600; }
.riddle-option { min-height: 66px; font-size: 16px; line-height: 1.35; transition: transform var(--motion-fast) var(--ease), border-color var(--motion-fast), background var(--motion-fast); }
.riddle-option span { width: 32px; height: 32px; flex-basis: 32px; font-size: var(--type-caption); font-weight: 700; }

.alarm-card, .form-card, .settings-card, .sound-card, .check-card, .arrival-card, .rehearsal-summary, .run-stats {
  box-shadow: var(--shadow-soft);
}
.alarm-card, .sound-card, .settings-card, .premium-sound-card, .sound-upgrade-strip {
  animation: card-arrive var(--motion-base) var(--ease) both;
}
.alarm-card { padding: 22px; }
.alarm-time { font-size: 37px; }
.alarm-time small { font-size: 17px; }
.alarm-label { font-size: var(--type-small); }
.alarm-meta, .home-countdown p { font-size: var(--type-small); line-height: 1.45; }
.tag { font-size: var(--type-micro); font-weight: 600; }
.home-countdown { margin-top: 24px; }

.bottom-nav { height: 66px; flex-basis: 66px; gap: 8px; margin-top: 8px; }
.bottom-nav button {
  min-height: 52px;
  border-radius: 17px;
  font-size: var(--type-caption);
  line-height: 1.1;
  font-weight: 600;
  transition: color var(--motion-fast), background var(--motion-fast), transform var(--motion-fast) var(--ease);
}
.bottom-nav button:active { transform: scale(.97); }
.bottom-nav button.active { background: rgba(231,90,124,.11); }
.bottom-nav button.active .nav-mark { animation: tab-pop 300ms var(--ease) both; }
.nav-mark { width: 19px; height: 16px; opacity: .82; }
.nav-mark--home::before { width: 12px; height: 12px; left: 1.8px; top: -6px; }

.alarm-label-field { font-size: var(--type-small); }
.alarm-label-field input { height: 50px; font-size: 16px; }
.days { gap: 8px; }
.day { min-height: 42px; font-size: var(--type-small); font-weight: 600; transition: transform var(--motion-fast) var(--ease), background var(--motion-fast); }
.day:active { transform: scale(.92); }
.form-row { min-height: 58px; }
.form-row label, .settings-row label { font-size: 15px; font-weight: 500; }
.form-row small, .settings-row small { font-size: var(--type-caption); line-height: 1.35; }
.form-row--button strong, .volume-row output { font-size: var(--type-caption); }
.segment button { min-height: 40px; padding-inline: 11px; font-size: var(--type-micro); font-weight: 600; }
.form-error { font-size: var(--type-small); }

.sound-upgrade-strip {
  width: 100%;
  min-height: 66px;
  margin-top: 12px;
  padding: 0 18px;
  border: 1px solid rgba(240,174,74,.3);
  border-radius: 22px;
  background: linear-gradient(120deg, rgba(240,174,74,.15), rgba(255,253,249,.82));
  color: var(--plum);
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-align: left;
  cursor: pointer;
}
.sound-upgrade-strip span, .sound-upgrade-strip b, .sound-upgrade-strip small { display: block; }
.sound-upgrade-strip b { font-size: 15px; }
.sound-upgrade-strip small { margin-top: 3px; color: var(--muted); font-size: var(--type-caption); }
.sound-upgrade-strip > strong { color: #986216; font-size: var(--type-caption); }

.settings-group > span { font-size: var(--type-micro); font-weight: 700; letter-spacing: .16em; }
.settings-row { min-height: 58px; }
.settings-row button:not(.toggle) { font-size: var(--type-small); font-weight: 500; }
.settings-head h1 { font-size: 29px; }

.sound-booth { padding-bottom: 30px; }
.sound-head { min-height: 52px; }
.sound-list { gap: 12px; margin: 12px 0 20px; }
.sound-section-head {
  margin-top: 24px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.sound-section-head span { color: var(--rose); font-size: var(--type-micro); font-weight: 700; letter-spacing: .15em; }
.sound-section-head small { color: var(--muted); font-size: var(--type-micro); }
.sound-library-teaser {
  width: 100%;
  min-height: 68px;
  margin-top: 18px;
  padding: 0 17px;
  border: 1px solid rgba(240,174,74,.32);
  border-radius: 22px;
  background: linear-gradient(120deg, rgba(240,174,74,.16), rgba(165,136,212,.1));
  color: var(--plum);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
  cursor: pointer;
  animation: card-arrive var(--motion-base) var(--ease) both;
}
.sound-library-teaser span, .sound-library-teaser small, .sound-library-teaser b { display: block; }
.sound-library-teaser small { color: #986216; font-size: 11px; font-weight: 800; letter-spacing: .1em; }
.sound-library-teaser b { margin-top: 4px; font-size: 15px; }
.sound-library-teaser > strong { color: #7658a6; font-size: var(--type-caption); }
.sound-card { min-height: 102px; padding: 14px; }
.sound-card__main b { font-size: 16px; }
.sound-card__main small { font-size: var(--type-caption); line-height: 1.4; }
.sound-action { min-width: 64px; min-height: 44px; font-size: var(--type-caption); font-weight: 600; }
.selected-badge { top: 9px; right: 15px; font-size: 11px; }
.selected-sound-bar { grid-template-columns: 106px 1fr; }
.selected-sound-bar span { font-size: 11px; }
.selected-sound-bar strong { font-size: var(--type-caption); }
.selected-sound-bar .primary { font-size: 15px; }

.backstage-library {
  margin: 8px -4px 24px;
  padding: 4px 4px 18px;
  border-radius: 28px;
}
.backstage-library > p { margin: 9px 0 14px; color: var(--muted); font-size: var(--type-small); line-height: 1.5; }
.premium-sound-list { display: grid; gap: 10px; margin-bottom: 12px; }
.premium-sound-card {
  min-height: 106px;
  padding: 12px;
  border: 1px solid rgba(240,174,74,.24);
  border-radius: 24px;
  background: linear-gradient(125deg, rgba(255,253,249,.96), rgba(240,174,74,.12));
  box-shadow: var(--shadow-soft);
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
}
.premium-sound-card--lilac { border-color: rgba(165,136,212,.25); background: linear-gradient(125deg, rgba(255,253,249,.96), rgba(165,136,212,.13)); }
.premium-sound-card__preview {
  min-width: 0;
  min-height: 72px;
  padding: 0;
  border: 0;
  background: transparent;
  display: grid;
  grid-template-columns: 54px 1fr;
  align-items: center;
  gap: 12px;
  color: inherit;
  text-align: left;

      this.stopRinging();

    }
  }

  <script data-source="runtime.js">(function () {
  "use strict";
  // One wall-clock resolver is shared by the forecast and actual browser dispatch.

  // first occurrence selected by Date. Travel follows the device's local zone.
  const dateKey = (date) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;

      const parts=String(alarm.onceDate || "").split("-").map(Number);
      if(parts.length!==3 || !parts.every(Number.isFinite))continue;
      const day=new Date(parts[0],parts[1]-1,parts[2],12);

})();

    startClock() {

    checkScheduledAlarm(now) {
      if (!this.state.onboarded) return;
      const stamp = +now;
      const from = this.state.lastScheduleCheckAt && this.state.lastScheduleCheckAt <= stamp ? this.state.lastScheduleCheckAt : stamp - 60000;
      const known = new Set(this.state.occurrences.map(item=>item.id));
      let changed = false;
      for (const item of Runtime.between(this.state.alarms,from,now)) {
        if (known.has(item.id)) continue;
        known.add(item.id);
        const {alarm,...record} = item;
        record.status = stamp-item.scheduledAt <= 10*60000 ? "queued" : "missed";
        this.state.occurrences.push(record);
        this.recordEvent(record.status === "missed" ? "missed" : "scheduled", {occurrenceId:record.id,scheduledAt:record.scheduledAt});
        if (record.status === "queued") this.state.pendingQueue.push({occurrenceId:record.id,alarm:this.clone(alarm),scheduledAt:record.scheduledAt});

        changed = true;
      }
      this.state.lastScheduleCheckAt = stamp;
      if (changed) this.save();
      else if (!this.state.activeSession) this.save();
      this.startNextQueued();
    }

    recordEvent(type, details = {}) {

      }

    handleKeyboard(event) {
      const hold=event.target.closest?.("[data-hold]");
      if(hold && [" ","Enter"].includes(event.key)) {event.preventDefault();if(!event.repeat)this.startHold(hold);return;}
      if(event.target.matches?.("input,textarea,select")) return;
      if(event.key==="Enter" && event.target.closest?.("button,[role=button]"))return;
      if (!event.target.closest("#app") || !["04", "18"].includes(this.state.screen)) return;
      const isRehearsalMath = this.state.screen === "18" && this.state.rehearsalMode === "math";
      if (/^[0-9]$/.test(event.key)) {
        event.preventDefault();
        if (this.state.screen === "04") this.appendMath(event.key);
        else if (isRehearsalMath) this.appendRehearsal(event.key);
      } else if (event.key === "Backspace") {
        event.preventDefault();
        if (this.state.screen === "04") this.state.math.input = this.state.math.input.slice(0, -1);
        else if (isRehearsalMath) this.state.rehearsalInput = this.state.rehearsalInput.slice(0, -1);
        this.updateAnswerInput(isRehearsalMath);
      } else if (event.key === "Enter") {
        event.preventDefault();
        if (this.state.screen === "04") this.submitMath();
        else if (isRehearsalMath) this.submitRehearsal();
      }
    }

    appendRehearsal(value) {
      if (!/^\d$/.test(String(value))) return;
      if (this.state.rehearsalInput.length >= 4) return;
      this.state.rehearsalInput += value;
      this.state.rehearsalError = "";
      this.updateAnswerInput(true);
    }

    updateAnswerInput(rehearsal) {
      const input = rehearsal ? this.state.rehearsalInput : this.state.math.input;
      const answer = document.querySelector(".screen .math-input");
      if (!answer) { this.render(); return; }
      answer.textContent = input;
      const action = rehearsal ? "rehearsal-submit" : "math-submit";
      const button = document.querySelector(`[data-action="${action}"]`);
      if (button) button.disabled = !input;
      if(!rehearsal)this.save();
      if (rehearsal) {
        const hint = document.querySelector(".screen .math-hint");
        if (hint && !this.state.rehearsalError) {
          hint.classList.remove("math-hint--wrong");
          hint.textContent = "Finish the answer, then meet The Finale.";
        }
      }
    }

    submitRehearsal() {
      if (!this.state.rehearsalInput) return;
      if (Number(this.state.rehearsalInput) === 25) {
        this.soundEngine.cue("success");
        this.state.rehearsalMode = "riddle";
        this.state.rehearsalError = "";
      } else {
        this.soundEngine.cue("error");
        this.vibrate([35, 35, 35]);
        this.state.rehearsalError = "Not quite — the same sum stays with you.";
        this.state.rehearsalInput = "";
      }
      this.render();
    }

    answerRehearsalRiddle(index) {

      if (index === riddle.answer) {

        this.state.rehearsalWrong = null;
        this.go("09");
      } else {
        this.soundEngine.cue("error");
        this.state.rehearsalWrong = index;
        this.vibrate([35, 35, 35]);
        this.render();
        setTimeout(() => { if (this.state.screen === "18") { this.state.rehearsalWrong = null; this.render(); } }, this.fast ? 100 : 800);
      }

    saveAlarm() {
      const label = this.state.alarm.label.trim();
      if (!label) return this.editorFailure("Give this alarm a short name.","alarm-label");
      if (this.state.alarm.repeatMode === "once") {
        const parts=String(this.state.alarm.onceDate).split("-").map(Number);
        if(parts.length!==3 || !parts.every(Number.isFinite)) return this.editorFailure("Choose the date for this one-time alarm.","alarm-date");
        const at=Runtime.resolve(this.state.alarm,new Date(parts[0],parts[1]-1,parts[2],12));
        if(+at<=Date.now()) return this.editorFailure("Choose a date and time that is still ahead.","alarm-date");
      } else if (!this.state.alarm.days.length) return this.editorFailure("Choose repeat days, or select Once.","repeat-days");
      this.state.alarm.label = label;
      this.state.alarm.soundId = this.state.soundId;
      this.state.alarm.maxVolume = this.state.masterVolume;
      if(this.state.editorMode === "new") this.state.alarm.enabled=true;
      const previous=this.clone(this.state.alarms);
      const index = this.state.alarms.findIndex((item) => item.id === this.state.alarm.id);
      if (index >= 0) this.state.alarms[index] = this.clone(this.state.alarm);
      else this.state.alarms.push(this.clone(this.state.alarm));
      this.state.alarms.sort((a, b) => a.time.localeCompare(b.time));
      this.state.editorMode = "edit";
      this.state.onboarded=true;
      this.state.editorOpen=false;
      if(!this.save()){this.state.alarms=previous;this.state.editorOpen=true;this.editorFailure("Your alarm was not saved. Free browser storage and try again.","alarm-label");return;}
      this.state.editorSnapshot=null;
      this.go("19");
    }

    toggleAlarm(id) {
      const alarm = this.state.alarms.find((item) => item.id === id);
      if (!alarm) return;

        this.toast("This one-time alarm has no future occurrence. Edit its date and time before turning it on.");
        return;
      }
      alarm.enabled = !alarm.enabled;
      if(!this.save()){alarm.enabled=!alarm.enabled;this.render();return;}

    }

    confirmDeleteAlarm() {
      const fields=["alarms","pendingQueue","occurrences","wakeChecks","editorOpen","editorSnapshot","activeSession","alarm"];
      const previous={};for(const field of fields)previous[field]=this.clone(this.state[field]);
      const alarmId=this.state.alarm.id;
      this.state.alarms = this.state.alarms.filter((item) => item.id !== alarmId);
      this.state.pendingQueue=this.state.pendingQueue.filter(item=>item.alarm.id!==alarmId);
      this.state.occurrences.forEach(item=>{if(item.alarmId===alarmId && item.status==="queued"){item.status="cancelled";item.reason="configuration_deleted";}});
      this.state.wakeChecks.forEach(item=>{if(item.alarm.id===alarmId && item.status==="pending"){item.status="cancelled";item.reason="configuration_deleted";}});
      if(this.state.activeSession?.alarm.id===alarmId){this.state.activeSession.alarm.check=false;this.state.alarm.check=false;}
      this.state.editorOpen=false;this.state.editorSnapshot=null;
      if(!this.save()){Object.assign(this.state,previous);this.render();return;}
      this.closeModal();
